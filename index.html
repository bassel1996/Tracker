<!DOCTYPE html>
<!--
=====================================================================================================
  PERSONAL TRACKER — the page (Index.html)
  A savings tracker (Budget / Recurring / Overview / Settings) and a Goals timeline, in one Apps Script web app.
  Code.gs is the server: it reads and writes the Google Sheet. Import.gs is a one-off importer for the old sheet.
=====================================================================================================

  HOW THIS FILE IS LAID OUT
    1. <head> script ......... applies Look (Glass/Classic) and Night mode before anything is drawn, so there is no flash.
    2. <style> ............... base styles → page-specific styles → phone rules → Glass look → Classic look → Night mode.
                               Later blocks only override colours/surfaces; layout lives in the base and phone blocks.
    3. <body> ................ a fixed skeleton: top bar (title, page controls "#tbar", tabs), #app (the page), toast, Undo.
    4. main <script>, in order: server calls → dates and periods → money helpers → calculations (calcPeriod/metrics)
                               → preview data (MOCK) → render() → one section per page → saving → click/change handlers.

  BIG DECISIONS AND WHY
    • One file, no build step, no libraries (except the Figtree font). Apps Script serves a single HTML file well, and
      nothing needs installing or updating. Charts are hand-drawn SVG for the same reason.
    • The whole page is redrawn from the data on every change (render()). Simpler than updating bits of the page and
      it can't drift out of sync. render() puts focus, cursor and scroll back so typing is never interrupted.
    • Edits show at once and save in the background ("optimistic" saving). Apps Script takes ~1–2 s per call, which
      felt painfully slow when every add waited for it. Safeguards:
        - api() runs server calls one at a time, in order, so a later edit can't be overwritten by an earlier one.
        - tracked()/PENDING: a reply only replaces what's on screen if no newer edit of the same thing is on its way.
        - cid(): new rows get their id on the page, so they can be edited before the sheet has answered.
        - On any error the page reloads everything from the sheet, so it never shows a change that didn't save.
    • USD is the base currency for every total. Each balance/line keeps the exchange rate from the day it was saved,
      so past months don't change when a currency moves. EGP (the second currency) is shown next to USD figures only.
    • The first tab is called "Budget" on screen (it was "Month"); inside the code it's still TAB 'month' / renderMonth.
    • Pay periods, not calendar months: a period starts on pay day ("2026-11" = 7 Nov – 6 Dec). Any month can have its
      own start date. A week belongs to the period holding 4+ of its days, so every week is in exactly one period.
    • Savings come from account balances (entered weekly); lines are the plan plus a spending log. "Spent" is worked
      out from income minus the change in savings, which catches spending that was never logged.
    • Recurring groups generate "virtual" lines each month (never stored). Changing one for a month saves a real line
      linked to its item; removing one saves a "skip" line. One source of truth, months can still differ.
    • Week-by-week plan: whole-month items count in week 1 (when salary and rent usually move); "every week" items
      count in each week. That's what "Planned by W2" and the weekly Overview are built on.
    • The By week grid shows every amount in one chosen currency ("Show in", USD by default) but each line keeps saving in
      its own currency; typed amounts are converted back. A code typed with the amount ("500 EGP") overrides the choice.
    • Moving a line (⇄): a line you typed moves itself; a recurring line is skipped in its month and a one-off copy is
      added to the target month, so the recurring item keeps repeating as before.
    • Per-device settings (Look, Night mode, Privacy, view choices) live in localStorage, because they're about this
      screen. Everything that is data lives in the sheet so every device agrees.
    • Targets: one is the MAIN target (Settings → Targets). The Budget page shows only that one; the Overview shows it by
      default and can switch to any one target, all of them, or none. If the main one is deleted, the first target takes over.
    • Privacy mode hides savings, balances, targets and income so the screen can be shown to someone. Spending stays.
      The Overview keeps the very same chart but drops the amounts: the scale reads as % of the target, the read-out in %.
    • Undo keeps the last 40 changes on the Budget and Recurring pages (cleared on reload). Each change records how to
      put things back; undoing writes that back to the sheet like any other edit.
    • Phone (≤640 px) gets different HTML in places (cards, compact grids), not only smaller CSS, because wide tables
      don't work on a phone. Desktop gets everything one font size up (the "fs" font-scale setting) for comfortable reading.

  LIMITS OUTSIDE THIS CODE (don't spend time "fixing" these)
    • Google wraps the app in its own page: the white strip behind the iPhone clock and the status-bar colour come
      from that wrapper. The app fades into it instead.
    • iOS blurs the area under the clock (scroll-edge effect) and apps can't turn it off; html.ios adds a band to clear it.
    • Safari's bars only disappear for a Home Screen web app.
    • Apps Script itself has ~1–2 s round trips; optimistic saving hides that, it can't remove it.

  TWO WAYS TO HOST THE SAME FILE
    • In Apps Script (doGet serves it): Google signs you in; Google's wrapper page controls the iPhone status bar.
    • On its own site, e.g. Netlify, saved as index.html next to icon-*.png and manifest.webmanifest: the page talks to
      Apps Script through doPost with an app key (see Code.gs), and colours the status bar itself (theme-color), so the
      clock area matches the app in day and night mode. Address + key are pasted once per device ("Connect" screen).
    The file works out where it is (IN_GOOGLE / HOSTED) and behaves accordingly; nothing needs editing between the two.

  PREVIEW MODE: open this file straight in a browser and it runs on sample data (MOCK), with nothing sent anywhere.
-->
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Home-screen app settings. Apps Script ignores these (its own page is in charge there); they take effect when the
     page is on its own site. "default" status bar = a solid bar in the theme-color below, with dark or light text to match. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" id="themeColor" content="#f1edfa">
<title>Personal Tracker</title>
<script>
/* Look (glass / classic) and night mode (off / on / auto = follow the phone or computer), applied before the page shows */
function getPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function applyTheme() {
  const h = document.documentElement, night = getPref('tracker-night', 'off');
  h.classList.toggle('glass', getPref('tracker-look', 'glass') === 'glass');
  h.classList.toggle('dark', night === 'on' || (night === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
  // Status bar colour (only works when the page is on its own site; inside Apps Script, Google's page decides it).
  // Matched to the top bar so the clock area and the app read as one surface, light or dark.
  const dark = h.classList.contains('dark'), glass = h.classList.contains('glass');
  // Classic: the bar is a solid colour, so the status bar simply takes the same one.
  // Glass: the bar is see-through over coloured glows, which a single status-bar colour can't copy. So the status bar takes
  // the bar's base colour, and the top of the bar fades in from that same colour (html.own .top::after), giving one surface.
  const sb = dark ? (glass ? '#121019' : '#1c1a24') : (glass ? '#f2f2f7' : '#ffffff'); // Glass: the page background (the bar itself is see-through)
  h.style.setProperty('--sb', sb);
  const tc = document.getElementById('themeColor');
  if (tc) tc.setAttribute('content', sb); // older iPhones (Safari 15–18) read this tag
  // Safari 26+ ignores that tag: it colours the status bar from a fixed element touching the top of the screen (or the
  // page background). #sbTint is that element. Safari doesn't always notice a colour change on its own (the bar stayed
  // dark after night mode was turned off), so the strip is hidden for one frame to make Safari look at it again.
  const t = document.getElementById('sbTint');
  if (t) { t.style.backgroundColor = sb; t.style.display = 'none'; requestAnimationFrame(() => requestAnimationFrame(() => { t.style.display = ''; })); }
}
/* Where the page runs: inside Google's Apps Script wrapper (an iframe), or on its own site (e.g. Netlify). */
const IN_GOOGLE = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
if (!IN_GOOGLE && /^https?:/.test(location.protocol)) {
  document.documentElement.classList.add('own'); // on its own site: the page sets the status-bar colour itself
  // own site: home-screen icon and app manifest (they live next to index.html)
  document.write('<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">');
}
applyTheme();
/* iPhone/iPad inside Google's wrapper: mark the page so the top bar can keep clear of the soft blur iOS draws under
   the clock. Not needed on its own site, where the status bar is a solid colour and the page starts below it. */
if (IN_GOOGLE && (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))) document.documentElement.classList.add('ios');
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'), f = () => { applyTheme(); try { if (D) render(); } catch (e) {} }; if (mq.addEventListener) mq.addEventListener('change', f); else mq.addListener(f); }
</script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================================================
   STYLES — order matters: later blocks override earlier ones.
     1. Base (colours as variables on :root, layout, tables, buttons) — shared by every look.
     2. Page sections (Goals, Month, Recurring, Overview, balances) and the phone block (max-width:640px).
     3. Glass look (html.glass) — Apple's Liquid Glass ("clear" setting): glass only on the floating controls,
        solid cards, neutral grey/black background. See the note at the top of that block.
     4. Classic look (html:not(.glass)) — plain cards with purple accents instead of black.
     5. Night mode (html.dark) — redefines the colour variables, then fixes the few things that used a hard-coded colour.
   --fs scales every font size (1 on phone, larger on desktop). Colours are variables so night mode is one swap.
   ===================================================================================================== */
:root{--fs:1;--bg:#e9e7f0;--card:#fff;--ink:#121117;--muted:#6b6b76;--line:#ececf1;--accent:#7c3aed;--accent-soft:#f4effe;--good:#0f9d6b;--bad:#d93a3a;--soft:#fafafc}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* computers: when you scroll past the top or bottom, don't let the bounce reach Google's white page around the app
   (that showed as a thin white bar, most visible in night mode) */
@media (min-width:641px){ html,body{overscroll-behavior:none} }
html{background-color:var(--bg)} /* Safari's fallback for the status-bar colour */
body{margin:0;font-family:Figtree,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:calc(14px * var(--fs))}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 20px;flex-wrap:nowrap}
.top .brand,.top .tabs{flex:none}
.brand{font-weight:700;font-size:calc(17px * var(--fs));display:flex;gap:10px;align-items:center}
.badge{font-size:calc(11px * var(--fs));font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:20px}
.badge.priv{background:var(--ink);color:#fff}
.badge{white-space:nowrap} .brand{white-space:nowrap;min-width:0}
.privnote{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:calc(13px * var(--fs))}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(18,17,23,.05)}
.card h2{font-size:calc(15px * var(--fs));margin:0 0 4px}
.hint{color:var(--muted);font-size:calc(12px * var(--fs));margin:0 0 12px;line-height:1.45}
.pnav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.pnav .pl{font-size:calc(20px * var(--fs));font-weight:700}
.pnav .pr{color:var(--muted);font-size:calc(13px * var(--fs))}
button.btn{font:inherit;font-size:calc(13px * var(--fs));border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--ink)}
button.btn:hover{border-color:#c9c9d3}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.icon{padding:6px 11px;font-size:calc(16px * var(--fs));line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(18,17,23,.05)}
.kpi .l{font-size:calc(11px * var(--fs));color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:calc(24px * var(--fs));font-weight:700;margin:6px 0 4px}
.kpi .s{font-size:calc(12px * var(--fs));color:var(--muted);line-height:1.5}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:calc(12px * var(--fs));color:var(--muted);font-weight:600}
th small{display:block;font-weight:400;font-size:calc(11px * var(--fs))}
td.r,th.r{text-align:right}
tr.total td{font-weight:700;border-bottom:0;background:var(--soft)}
th.nowc{color:var(--accent)} td.nowc{background:var(--accent-soft)}
.future{opacity:.6}
input,select{font:inherit;font-size:calc(13px * var(--fs));border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.cellv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}

.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:calc(18px * var(--fs));line-height:1;padding:2px 6px}
.del:hover{color:var(--bad)}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0 6px}

.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:calc(12px * var(--fs));color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.warn{background:#fff7e6;border:1px solid #ffd591;color:#8a5a00;padding:10px 12px;border-radius:10px;margin-bottom:16px;font-size:calc(13px * var(--fs))}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:calc(12px * var(--fs));color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
tr.now td{background:var(--accent-soft)} tr.now:hover td{background:#ebe2fd}
.nowtag.tgtag{background:var(--ink)}
.ctip .tsep2{height:1px;background:rgba(255,255,255,.18);margin:4px 0}
.nowtag{display:inline-block;font-size:calc(10px * var(--fs));font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.3px}
.pcards .pc.now{background:var(--accent-soft);border-radius:10px;padding:12px 10px;border-bottom-color:transparent}
.chartwrap{position:relative;touch-action:pan-y;cursor:crosshair}
.ctip{position:absolute;top:6px;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:calc(12px * var(--fs));line-height:1.55;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(18,17,23,.25);z-index:5}
.ctip b{font-size:calc(13px * var(--fs))} .ctip .k{color:#b9b6c6} .ctip .pos{color:#5ee0a8} .ctip .neg{color:#ff8a8a}
.gantt tr.m th.curm{background:var(--accent-soft);color:var(--accent)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:calc(13px * var(--fs));margin-top:10px;color:var(--muted)}
.sum b{color:var(--ink)}
/* ---- Goals (Gantt) ---- */
/* all Goals controls in one line, all the same height; swipe sideways if they don't fit */

.tbar{flex:1 1 auto;min-width:0;display:flex;align-items:center;overflow-x:auto;padding:10px 14px;margin:-10px -14px;scrollbar-width:none;white-space:nowrap;-webkit-overflow-scrolling:touch}
.tbar::-webkit-scrollbar{display:none}
.tbar:empty{display:none}
.tbar>*{flex:none}
.top.notitle .brand{display:none}
.top.two{flex-wrap:wrap} .top.two .tabs{margin-left:auto} .top.two .tbar{order:3;flex-basis:calc(100% + 28px)}
.gtool{display:flex;align-items:center;gap:6px}
.gtool>*{flex:none}

.tbar .btn,.tbar .seg{height:34px;box-sizing:border-box}
.tbar .btn{display:inline-flex;align-items:center;justify-content:center;padding:0 12px}

  .top{padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  /* iOS softly blurs the strip of page right under the clock (its "scroll edge" effect), and the app can't turn that off.
     On iPhones the top bar gets an empty band at its top for that blur to fall on, so the buttons and month stay sharp. */
  html.ios .top{padding-top:calc(30px + env(safe-area-inset-top))}
  /* own site: iOS already leaves room for the clock in its status bar, so the bar itself needs only a little top padding */
  html.own .top{padding-top:calc(3px + env(safe-area-inset-top))}
  /* own site, Glass look: the status bar is one solid colour (--sb); the bar's top 18px fades in from that colour so
     the status bar and the glass bar join without a line, even where the glows tint the bar purple or pink */
  html.own.glass .top::after{content:'';position:absolute;left:0;right:0;top:0;height:12px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,var(--sb),rgba(0,0,0,0))}

  html.ios.dark .top::after{content:'';position:absolute;left:0;right:0;top:0;height:calc(28px + env(safe-area-inset-top));z-index:-1;pointer-events:none;background:linear-gradient(180deg,#fff 0,#fff calc(100% - 8px),rgba(255,255,255,0) 100%)}
  .brand{font-size:calc(16px * var(--fs))}
  /* phone bottom tab bar (Classic look; Glass overrides it into a floating capsule further down).
     Bottom padding: iPhones report ~34px of "safe area" for the home bar, which looked far bigger than the 6px on top.

  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:0;background:rgba(255,255,255,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px max(8px, calc(env(safe-area-inset-bottom) - 18px));gap:0}

/* ================= Liquid Glass look (Settings → Look) =================
   Modelled on Apple's Liquid Glass (iOS / macOS 26, refined in 27), set to the "clear" end of Apple's transparency
   slider, as asked. Rules taken from Apple's design guidelines:
   - Glass is only for the layer of controls and navigation that floats above the content: the top bar's buttons,
     the page tabs, the phone tab bar and pop-ups. Content (cards, boxes, tables) stays on plain solid surfaces —
     Apple: "Don't use Liquid Glass in the content layer." (The earlier version frosted every card, which is why it
     looked more like 2000s Windows than a 2026 Apple app.)
   - Clear glass: almost no tint, a light blur, a thin bright rim and a soft shadow. No glossy top-to-bottom gradients —
     those are what read as "Vista".
   - Neutral backgrounds like Apple's apps: light grey (#f2f2f7) by day, black at night. No colour wash.
   - The top bar isn't a solid strip: its controls float, and content scrolling underneath is softly blurred and faded
     (Apple's "scroll edge effect").
   - Buttons and fields inside the content use Apple's grey fills, with the purple accent for the main action.
   Only the look changes: every page keeps its layout. Remove the "glass" class on <html> for the classic look. */
html.glass{--bg:#f2f2f7;--card:#fff;--ink:#1d1d1f;--muted:#86868b;--line:#e5e5ea;--soft:#f7f7f9;--accent-soft:#f3edff;
  --fill:rgba(118,118,128,.12);   /* Apple's grey fill: buttons and fields in the content */
  --fill-hi:rgba(118,118,128,.2);
  --glass:rgba(255,255,255,.08);  /* clear glass: barely tinted (asked for more see-through) */
  --glass-hi:rgba(255,255,255,.42); /* the selected item on glass */
  --rim:inset 0 0 0 .5px rgba(255,255,255,.75),inset 0 1px 0 rgba(255,255,255,.8); /* thin bright edge */
  --glass-shadow:0 4px 18px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --glass-blur:blur(6px) saturate(190%);
  --edge:rgba(242,242,247,.55)}   /* scroll-edge fade under the top bar */
html.glass body{background:var(--bg)}
/* content layer: solid, rounded, flat */
html.glass .card,html.glass .kpi{background:var(--card);border:0;border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
html.glass .kpi{border-radius:18px}
html.glass .gwrap{background:var(--card);border:0;border-radius:16px;box-shadow:none}
/* top bar: no solid strip; a soft blur + fade behind the floating controls (scroll edge effect) */
html.glass .top{background:transparent;border-bottom:0;box-shadow:none}
html.glass .top::before{content:'';position:absolute;left:0;right:0;top:0;bottom:-16px;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,var(--edge) 0%,var(--edge) 50%,rgba(0,0,0,0) 100%);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
/* buttons and fields in the content: grey fills, no borders, rounded like iOS */
html.glass button.btn{background:var(--fill);border:0;border-radius:999px;color:var(--ink);box-shadow:none}
html.glass button.btn:hover:not(:disabled){background:var(--fill-hi)}
html.glass button.btn:active:not(:disabled){transform:scale(.97)}
html.glass .btn.primary{background:var(--accent);color:#fff}
html.glass .btn.primary:hover:not(:disabled){background:#6d28d9}
html.glass .btn.on{background:var(--accent-soft);color:var(--accent)}
html.glass .seg{background:var(--fill);border:0;border-radius:999px;padding:2px;box-shadow:none}
html.glass .seg button{border-radius:999px}
html.glass .seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
html.glass .secnav button,html.glass .wk-pick button{background:var(--fill);border:0;box-shadow:none}
html.glass .secnav button.on,html.glass .wk-pick button.on{background:var(--accent);color:#fff;box-shadow:none}
html.glass .wk-pick button{border-radius:14px} html.glass .wk-pick button.on small{color:#ece4ff}
html.glass input,html.glass select{background:var(--fill);border:1px solid transparent;border-radius:10px;box-shadow:none}
html.glass input:focus,html.glass select:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
/* the floating layer: Liquid Glass (clear) — top-bar controls and page tabs */
html.glass .top button.btn,html.glass .top .seg,html.glass .top select,html.glass .tabs{background:var(--glass);border:0;
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--rim),var(--glass-shadow)}
html.glass .top select{border-radius:999px}
html.glass .top button.btn:hover:not(:disabled){background:var(--glass-hi)}
html.glass .top .btn.primary{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(124,58,237,.28)}
html.glass .top .btn.on,html.glass .top .seg button.on,html.glass .top .secnav button.on{background:var(--glass-hi);color:var(--accent);box-shadow:var(--rim),0 1px 4px rgba(0,0,0,.08)}
html.glass .top .secnav button{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--rim),var(--glass-shadow)}
html.glass .tabs{border-radius:999px;padding:4px}
html.glass .tabs button{border-radius:999px}
html.glass .tabs button.active{background:var(--glass-hi);color:var(--accent);box-shadow:var(--rim),0 1px 4px rgba(0,0,0,.08)}
/* Goals timeline names */
html.glass .gantt .gname{background:transparent;border:0;box-shadow:none;border-radius:8px}
html.glass .gantt .gname:hover{background:rgba(124,58,237,.06)}
html.glass .gantt .gname:focus{background:var(--card);box-shadow:0 0 0 2px rgba(124,58,237,.35)}
/* pop-ups and floating bars: Apple's "regular" glass (a bit more frost, since they hold text) */
html.glass .nmodal{background:rgba(0,0,0,.18)}
html.glass .nbox,html.glass .gselbar,html.glass .gghost{background:rgba(255,255,255,.58);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:0;box-shadow:var(--rim),0 20px 50px rgba(0,0,0,.18)}
html.glass .nbox{border-radius:28px} html.glass .gselbar{border-radius:24px} html.glass .gghost{border-radius:14px}
html.glass #toast{background:rgba(30,30,32,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:999px;padding:10px 18px}
html.glass #toast.err{background:rgba(217,58,58,.92)}
html.glass .warn{background:#fff8e6;border:0;border-radius:16px}
@media (max-width:640px){
  /* Phone tab bar, modelled on iOS 26/27 apps (e.g. the reference screenshot from Telegram):
     - the bar is very clear glass: barely tinted, light blur, a bright rim around the edge that catches the light;
     - the selected page sits in a solid tinted pill (not glass), and its icon + label take the accent colour;
     - the other pages are plain, full-strength text colour (not greyed), so labels stay readable over content. */
  html.glass .tabs{left:12px;right:12px;bottom:max(4px, calc(env(safe-area-inset-bottom) - 18px));padding:5px;border-radius:32px;background:rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(5px) saturate(180%);backdrop-filter:blur(5px) saturate(180%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.3),0 8px 26px rgba(0,0,0,.16)}
  html.glass .tabs.away{transform:translateY(calc(100% + 16px + env(safe-area-inset-bottom)))}
  html.glass .tabs button{border-radius:27px;color:var(--ink);font-weight:600}
  html.glass .tabs button .ti{opacity:1}
  html.glass .tabs button.active{background:rgba(118,118,128,.16)!important;box-shadow:none!important;color:var(--accent)}
  html.glass .card,html.glass .kpi{border-radius:20px}
  /* inside Google's wrapper only: its white strip behind the clock — fade the page to white at the very top */
  html.glass:not(.dark):not(.own) body::after{content:'';position:fixed;left:0;right:0;top:0;height:140px;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#fff 0,rgba(255,255,255,0) 100%)}
  html.glass .gselbar{bottom:calc(84px + env(safe-area-inset-bottom))}
  html.glass #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}

/* ================= Night mode (Settings → Look) ================= */
html.dark{--bg:#121019;--card:#1c1a24;--ink:#ece9f5;--muted:#a19cb3;--line:#2c2938;--accent:#a78bfa;--accent-soft:rgba(167,139,250,.14);--good:#34d399;--bad:#f87171;--soft:#211e2b;color-scheme:dark}
/* things that used the text colour as a dark fill get the purple instead */
html.dark .btn.primary,html.dark .seg button.on,html.dark .wk-pick button.on,html.dark .secnav button.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
html.dark .wk-pick button.on small{color:#e4dcff}
html.dark .badge.priv,html.dark .nowtag.tgtag{background:#ece9f5;color:#121019}
html.dark .ctip,html.dark #toast{background:#2a2636;color:#ece9f5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
html.dark button.btn:hover{border-color:#4a4558}
html.dark input,html.dark select{background:#15131c;color:var(--ink)}
html.dark .warn{background:#2b2214;border-color:#5c4520;color:#f3c77a}
html.dark .tsep{background:#3a3646}
html.dark .tgl span{background:#3a3646} html.dark .skchips button.off{background:#15131c}
html.dark .bsw.plan{background:#4c3a7a}
/* Night + Classic: fields and buttons sit a step LIGHTER than the card (they used to be darker, almost the same as the
   card, so they were hard to see). Lighter fill + a visible border is how dark interfaces show "you can type/tap here". */
html.dark:not(.glass) input,html.dark:not(.glass) select,html.dark:not(.glass) textarea{background:#2a2637;border:1px solid #4a4560;color:var(--ink)}
html.dark:not(.glass) input::placeholder{color:#8f89a3}
html.dark:not(.glass) input:hover,html.dark:not(.glass) select:hover{border-color:#5f5878}
html.dark:not(.glass) input:focus,html.dark:not(.glass) select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.22);outline:none}
html.dark:not(.glass) button.btn{background:#2e2a3d;border-color:#4a4560;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}
html.dark:not(.glass) button.btn:hover:not(:disabled){background:#37324a;border-color:#5f5878}
html.dark:not(.glass) .btn.primary{background:#7c3aed;border-color:#8b5cf6;color:#fff}
html.dark:not(.glass) .btn.primary:hover:not(:disabled){background:#8b4cf3}
html.dark:not(.glass) .btn.on{background:rgba(167,139,250,.2);border-color:#a78bfa;color:#e4dcff}
html.dark:not(.glass) .seg{background:#24212f;border-color:#4a4560}
html.dark:not(.glass) .seg button{color:#c9c3dc}
html.dark:not(.glass) .skchips button,html.dark:not(.glass) .wk-pick button,html.dark:not(.glass) .secnav button{background:#2e2a3d;border-color:#4a4560;color:var(--ink)}
html.dark:not(.glass) .skchips button.off{background:#15131c;color:var(--muted)}
/* the faint Actual boxes in the By week grid stay quiet until hovered or filled, but get an outline so you can find them */
html.dark:not(.glass) .wke input.wkact{background:transparent;border-color:#3a3548}
html.dark:not(.glass) .wke input.wkact:hover,html.dark:not(.glass) .wke input.wkact:focus{background:#2a2637;border-color:#5f5878}
/* selected choices keep their purple fill (these come after the rules above, so they win) */
html.dark:not(.glass) .seg button.on,html.dark:not(.glass) .wk-pick button.on,html.dark:not(.glass) .secnav button.on{background:#7c3aed;border-color:#8b5cf6;color:#fff}

<script>
/* =====================================================================
   Data access. Inside Apps Script this calls the server (Code.gs).
   Opened directly in a browser it runs on sample data (preview mode).
   ===================================================================== */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// Server calls run one at a time, in the order they were made. Apps Script would otherwise run them in
// parallel, so a quick second edit could reach the sheet before the first and then be overwritten by it.
let CHAIN = Promise.resolve();
// Every server call goes through api(): one queue, in order. In preview mode (file opened directly) the
// same calls run against MOCK, so the whole page can be tested without Apps Script.
/* Three ways to reach the data:
   - inside Apps Script: google.script.run (Google signs you in);
   - on its own site (Netlify): a POST to your Apps Script web-app address with your app key (see doPost in Code.gs).
     The address and key are typed once per device and kept in this browser only;
   - opened as a file: sample data (preview mode). */
const HOSTED = !IS_GAS && typeof location !== 'undefined' && /^https?:/.test(location.protocol);
function conn() { try { return JSON.parse(localStorage.getItem('tracker-conn') || 'null'); } catch (e) { return null; } }
function postApi(fn, args) {
  const c = conn(); if (!c) return Promise.reject(new Error('Not connected yet.'));
  // text/plain keeps it a "simple" request, which Apps Script accepts from another site without extra handshakes
  return fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: c.key, fn, args }) })
    .then(r => r.json(), () => { throw new Error('Couldn’t reach your sheet. Check your internet connection.'); })
    .then(j => { if (!j || !j.ok) throw new Error((j && j.error) || 'Something went wrong.'); return j.result; });
}
function api(fn, ...args) {
  const call = () => USE_MOCK
    ? new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(MOCK[fn](...args)))); } catch (e) { rej(e); } }, 150))
    : HOSTED ? postApi(fn, args)
    : new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  const p = CHAIN.then(call, call);
  CHAIN = p.then(() => {}, () => {});

}
// Counts saves still waiting per item, so an older save's reply never overwrites a newer edit on screen.
const PENDING = {};
function tracked(key, p) { PENDING[key] = (PENDING[key] || 0) + 1; return p.finally(() => { PENDING[key]--; }); }

/* =====================================================================
   Dates, pay periods and weeks
   - A period starts on pay day and ends the day before the next pay day.
     It is named after the month it starts in ("2026-11" = 7 Nov – 6 Dec).
   - A week belongs to the period that holds 4 or more of its 7 days.
   ===================================================================== */
const DEF = { payday: '7', weekStart: '1', secondaryCurrency: 'EGP', currencies: 'USD,EGP,EUR', openingPeriod: '', openingBalance: '', periodStarts: '{}', mainTarget: '' };
// Page state. D = everything getData() returned (the page's local copy of the sheet). IDX = lookups rebuilt on each
// render (balances by week/account, categories by id). TAB = open page. PERIOD = the month shown on the Month page ('YYYY-MM').
let D = null, IDX = null, TAB = 'month', PERIOD = null;
const S = () => (D && D.settings) || DEF;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
// Dates are handled as local midnight Date objects and 'YYYY-MM-DD' strings, never with time zones, so a
// week never shifts by a day when the phone and the sheet sit in different time zones.
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const fmtDay = d => d.getDate() + ' ' + MON[d.getMonth()];
const fmtDate = s => { const d = parseISO(s); return fmtDay(d) + ' ' + d.getFullYear(); };

// Pay day and week start come from Settings. Bad values fall back to the defaults instead of breaking every date.
function payday() { const p = parseInt(S().payday, 10); return p >= 1 && p <= 31 ? p : 1; }
function weekStartDay() { const w = parseInt(S().weekStart, 10); return w >= 0 && w <= 6 ? w : 1; }
function nextKey(k, n = 1) { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
/* Months can start on their own date (stored in settings.periodStarts); otherwise on pay day. */
let OVC = { src: null, map: {} };
// Months with their own start date (Settings → Pay periods), stored as JSON {'YYYY-MM': 'YYYY-MM-DD'}.
// Parsed once and cached until the setting text changes, because period maths runs thousands of times per render.
function overrides() {
  const src = S().periodStarts || '{}';
  if (OVC.src !== src) { let m = {}; try { m = JSON.parse(src) || {}; } catch (e) { m = {}; } OVC = { src, map: m }; }
  return OVC.map;
}
function defaultStart(k) { const [y, m] = k.split('-').map(Number); const dim = new Date(y, m, 0).getDate(); return new Date(y, m - 1, Math.min(payday(), dim)); }
function periodStartWith(ov, k) { return ov[k] ? parseISO(ov[k]) : defaultStart(k); }
function periodStart(k) { return periodStartWith(overrides(), k); }
const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
function periodEnd(k) { return addDays(periodStart(nextKey(k)), -1); }
// Which period a day falls in: the month it's in, or the month before if it's before that month's start day.
function periodOf(d) { let k = d.getFullYear() + '-' + pad(d.getMonth() + 1); if (d < periodStart(k)) k = nextKey(k, -1); return k; }
function weekStartOf(d) { return addDays(d, -((d.getDay() - weekStartDay() + 7) % 7)); }
function periodOfWeek(ws) { return periodOf(addDays(parseISO(ws), 3)); } // the 4th day is always in the majority period
// The weeks of a period. A week counts for the period holding 4+ of its 7 days, so every week belongs to exactly one
// period and a month has 4 or 5 weeks. Balances are entered per week, so this decides which month each balance counts in.
function weeksOf(k) {
  const s = periodStart(k), e = periodEnd(k), out = [];
  for (let w = weekStartOf(s); w <= e; w = addDays(w, 7)) {
    const we = addDays(w, 6);
    const days = daysBetween(w > s ? w : s, we < e ? we : e) + 1;
    if (days >= 4) out.push({ key: iso(w), start: w, end: we });
  }
  return out;
}
/* Goals page calendar: Monday-to-Sunday weeks; a week belongs to the calendar month holding 4+ of its days (its Thursday). */
const gMonday = d => addDays(d, -((d.getDay() + 6) % 7));
// Goals timeline weeks for a year (ISO-style: a week belongs to the year/month its Thursday is in). Separate from
// pay-period weeks on purpose: goals are about calendar time, money is about pay periods.
function gWeeks(y) {
  const out = [], per = Array(12).fill(0);
  for (let m = gMonday(new Date(y, 0, 1)); ; m = addDays(m, 7)) {
    const th = addDays(m, 3);
    if (th.getFullYear() > y) break;
    if (th.getFullYear() === y) { const mo = th.getMonth(); per[mo]++; out.push({ key: iso(m), date: m, month: mo, n: per[mo], y }); }
  }
  return out;
}
const periodLabel = k => { const [y, m] = k.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; };
const periodRange = k => fmtDay(periodStart(k)) + ' – ' + fmtDay(periodEnd(k));

/* ---------- Money ---------- */
// The display currency of the By week grid (per device). USD by default.
let WCUR = (() => { try { return localStorage.getItem('tracker-wcur') || 'USD'; } catch (e) { return 'USD'; } })();
const wcur = () => (WCUR === 'USD' || rateOf(WCUR)) ? WCUR : 'USD'; // fall back to USD if that currency has no rate
const moneyBase = (v, c) => money(v, c);
function money(v, cur = 'USD') {
  if (v == null || !isFinite(v)) return '—';
  const sign = v < 0 ? '-' : '';
  const n = Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
  return cur === 'USD' ? sign + '$' + n : sign + n + ' ' + cur;
}
// Number formatting helpers. '—' means 'not known yet', never zero, so an empty month never looks like a $0 month.
const signed = (v, cur) => v == null ? '—' : (v > 0 ? '+' : '') + money(v, cur);
const pct = v => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(1) + '%';
const cls = v => v == null ? '' : v >= 0 ? 'pos' : 'neg';
// Exchange rates: 1 unit of the currency in USD. USD is the base for every total; the second currency (EGP)
// is only ever shown next to a USD figure, converted at today's rate.
const rateOf = c => { const r = D && D.rates && D.rates[c]; return r && r.rate ? r.rate : null; }; // 1 unit of c = rate USD
const sec = () => String(S().secondaryCurrency || '').toUpperCase();
const inSec = usd => { const r = rateOf(sec()); return usd == null || !r ? null : usd / r; };
const secTxt = usd => { const c = sec(); if (!c || c === 'USD' || usd == null) return ''; const v = inSec(usd); return v == null ? '' : money(v, c); };
// USD value of an amount. Uses the rate saved on that row (frozen on the day it was saved) so past months don't move
// when a currency moves; falls back to today's rate for rows that don't have one yet.
const usdOf = (amount, rate, cur) => { const r = rate || rateOf(cur); return r ? amount * r : 0; };
/** Accepts plain numbers or simple sums like "6250+8323" or "60*10". Returns '' for blank, NaN if invalid. */
function evalAmount(str) {
  const s = String(str == null ? '' : str).replace(/[,\s]/g, '');
  if (s === '') return '';
  let i = 0;
  const num = () => { const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]); };
  const factor = () => {
    if (s[i] === '-') { i++; return -factor(); }
    if (s[i] === '+') { i++; return factor(); }
    if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; }
    return num();
  };
  const term = () => { let v = factor(); while (s[i] === '*' || s[i] === '/') { const op = s[i++], r = factor(); v = op === '*' ? v * r : v / r; } return v; };
  const expr = () => { let v = term(); while (s[i] === '+' || s[i] === '-') { const op = s[i++], r = term(); v = op === '+' ? v + r : v - r; } return v; };
  try { const v = expr(); return i === s.length && isFinite(v) ? Math.round(v * 100) / 100 : NaN; } catch (e) { return NaN; }
}
// Escapes text before it goes into HTML. Every name, note or label typed by you passes through this.
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The currencies offered in pickers: USD first, then Settings → Currencies, then any extra already in use (so an
// old row's currency never disappears from its own picker).
function currencies(extra) {
  const list = ['USD'].concat(String(S().currencies || '').split(/[\s,]+/).map(x => x.trim().toUpperCase())).concat(extra || []);
  return list.filter((x, i, a) => /^[A-Z]{3}$/.test(x) && a.indexOf(x) === i);
}

/* =====================================================================
   Calculations (same rules as the original sheet)
   - Week total     = sum of every account in USD. Accounts not entered that
                      week carry their last balance.
   - Actual         = total of the latest week entered in the period.
   - Planned        = last period's Actual (or its Planned if there's no Actual)
                      + planned income − planned expenses.
   - Change         = Actual − last period's Actual.
   - Spent          = income − change (income = actual where logged, else planned).
                      Catches spending you didn't log.
   - Accuracy       = Actual ÷ Planned.
   ===================================================================== */
function buildIndex() {
  const byWeek = {}, byAcc = {};
  D.balances.forEach(b => {
    (byWeek[b.weekStart] = byWeek[b.weekStart] || {})[b.accountId] = b;
    (byAcc[b.accountId] = byAcc[b.accountId] || []).push(b);
  });
  Object.values(byAcc).forEach(a => a.sort((x, y) => x.weekStart < y.weekStart ? -1 : 1));
  const cat = {}; D.categories.forEach(c => { cat[c.id] = c; });
  IDX = { byWeek, byAcc, cat };
}
// The account's last balance before a week. Used to 'carry over' a balance you skipped entering, shown in grey.
function lastBefore(accId, ws) { let r = null; for (const b of (IDX.byAcc[accId] || [])) { if (b.weekStart < ws) r = b; else break; } return r; }
// Total savings in USD for a week: every active account's balance that week, or its carried-over balance.
// null when nothing at all was entered that week (so an empty week is 'unknown', not $0).
function weekTotal(ws) {
  const wk = IDX.byWeek[ws]; if (!wk) return null;
  let t = 0;
  D.accounts.forEach(a => { const e = wk[a.id] || (a.active ? lastBefore(a.id, ws) : null); if (e) t += usdOf(e.amount, e.rate, e.currency); });
  return t;
}
const catType = l => (IDX.cat[l.categoryId] || {}).type || 'expense';
// The first period the tracker knows about: the opening period from Settings, else the month of the first balance.
function firstKey() {
  if (S().openingPeriod) return S().openingPeriod;
  let k = null;
  D.balances.forEach(b => { const p = periodOfWeek(b.weekStart); if (!k || p < k) k = p; });
  D.lines.forEach(l => { if (!k || l.period < k) k = l.period; });
  return k || periodOf(today());

// The last period worth showing: today's, or later if lines or balances were entered ahead.
function lastKey() {
