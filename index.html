document.addEventListener('keydown', e => { if (GDRAG && e.key === 'Escape') dragEnd(true); if (CATPICK && e.key === 'Escape') closeCatPick(); if (MOVE && e.key === 'Escape') closeMove(); });

/* ---- Goal menu (⋯) ---- */
let GMENU = null;
// Menu for one goal: colour, group, hide, delete.
function goalMenuHtml() {
  return `<div class="nmodal" id="gmenu" hidden><div class="nbox" role="dialog" aria-modal="true" aria-labelledby="gmTitle">
    <h2 id="gmTitle"></h2>
    <label class="f" style="margin-top:8px">Group<select id="gmGroup" data-act="gmGroup"></select></label>
    <div id="gmNewWrap" class="row" style="margin-top:8px" hidden><input id="gmNew" placeholder="New group name" maxlength="60" style="flex:1"><button class="btn primary" data-act="gmNewSave">Add</button></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="gmMove" data-d="-1" id="gmUp">↑ Move up</button><button class="btn" data-act="gmMove" data-d="1" id="gmDown">↓ Move down</button><button class="btn" data-act="gmHide" id="gmHide">Hide goal</button></div>
    <div class="row nbtns"><button class="btn danger" data-act="gmDelete">Delete goal</button><span style="flex:1"></span><button class="btn" data-act="gmClose">Done</button></div>
  </div></div>`;
}
function openGoalMenu(id) {
  const g = D.goals.find(x => x.id === id); if (!g) return;
  GMENU = id;
  const L = goalLayout(), grp = L.find(x => x.goals.some(y => y.id === id)), i = grp.goals.findIndex(y => y.id === id);
  document.getElementById('gmTitle').textContent = g.name || 'Untitled goal';
  document.getElementById('gmGroup').innerHTML = `<option value="">No group</option>` + L.filter(x => x.name).map(x => `<option ${x.name === (g.grp || '') ? 'selected' : ''}>${esc(x.name)}</option>`).join('') + `<option value="__new">New group…</option>`;
  document.getElementById('gmGroup').value = g.grp || '';
  document.getElementById('gmNewWrap').hidden = true;
  document.getElementById('gmUp').disabled = stepIndex(grp.goals, i, -1) < 0;
  document.getElementById('gmDown').disabled = stepIndex(grp.goals, i, 1) < 0;
  document.getElementById('gmHide').textContent = g.hidden ? 'Unhide goal' : 'Hide goal';
  document.getElementById('gmenu').hidden = false;
}
function closeGoalMenu() { GMENU = null; const m = document.getElementById('gmenu'); if (m) m.hidden = true; }
app.addEventListener('click', e => { if (e.target.id === 'cpmodal') closeCatPick(); if (e.target.id === 'mvmodal') closeMove(); if (e.target.id === 'skmodal') closeSkip(); if (e.target.id === 'gmenu') closeGoalMenu(); if (e.target.id === 'ggmenu') { GGMENU = null; e.target.hidden = true; } if (e.target.id === 'ymodal') e.target.hidden = true; });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'yNew') { e.preventDefault(); ACTIONS_EXTRA.yAdd(); } });
app.addEventListener('keydown', e => {
  if (!GMENU) return;
  if (e.key === 'Escape') { e.preventDefault(); closeGoalMenu(); }
  if (e.key === 'Enter' && e.target.id === 'gmNew') { e.preventDefault(); e.stopPropagation(); ACTIONS_EXTRA.gmNewSave(); }
}, true);

// Redraw only the goal rows (faster than a full render while painting weeks).
function repaintGoals() { const b = document.getElementById('gbody'); if (b) b.innerHTML = goalsBody(shownWeeks()); }

const colX = (wrap, th) => th.getBoundingClientRect().left - wrap.getBoundingClientRect().left + wrap.scrollLeft;
// Scroll the timeline so this week sits in the middle.
function gScrollToday(alsoPage) {
  const wrap = document.querySelector('.gwrap'); if (!wrap) return;
  const th = wrap.querySelector('th.wk.today'), lw = wrap.querySelector('th.gl').offsetWidth;
  wrap.scrollLeft = th ? Math.max(0, colX(wrap, th) - lw - (wrap.clientWidth - lw) / 2) : 0;
  if (alsoPage) { const c = document.querySelector('.gcard'), top = c.getBoundingClientRect().top + window.scrollY - hdrHeight() - 70; window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); }
}
/** Scrolls the timeline so this week sits just right of the goal names (phone's opening view). */
function gScrollWeek() {
  const wrap = document.querySelector('.gwrap'); if (!wrap) return;
  const th = wrap.querySelector('th.wk.today'); if (!th) return gScrollToday(false);
  wrap.scrollLeft = Math.max(0, colX(wrap, th) - wrap.querySelector('th.gl').offsetWidth);
}
/** Scrolls the timeline so the current month's first week sits just right of the goal names. */
function gScrollMonth(instant) { // instant = on opening the page (no glide, page itself stays put)
  const wrap = document.querySelector('.gwrap'); if (!wrap) return;
  const now = wrap.querySelector('th.wk.today'); if (!now) return gScrollToday(false); // this year isn't showing
  const first = wrap.querySelector(`th.wk[data-y="${now.dataset.y}"][data-m="${now.dataset.m}"]`);
  const left = Math.max(0, colX(wrap, first) - wrap.querySelector('th.gl').offsetWidth);
  if (instant) { wrap.scrollLeft = left; return; }
  wrap.scrollTo({ left, behavior: 'smooth' });
  const c = document.querySelector('.gcard'), top = c.getBoundingClientRect().top + window.scrollY - hdrHeight() - 16;
  if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}
/** Scrolls the timeline so the given year's first week sits just right of the goal names. */
function gScrollYear(y) {
  const wrap = document.querySelector('.gwrap'); if (!wrap) return;
  const th = wrap.querySelector(`th.wk[data-y="${y}"]`); if (th) wrap.scrollLeft = Math.max(0, colX(wrap, th) - wrap.querySelector('th.gl').offsetWidth);
}

let GPAINT = null, GPTR = 'mouse';
/* What a tap/click does to a week, given the selected brush and what's there now:
   Planned: empty or done -> planned, planned -> cleared.  Done: done -> back to planned, otherwise -> done.
   (The Note brush doesn't change marks; it opens the note box instead.) */
function brushResult(cur) {
  if (GBRUSH === 'done') return cur === 'done' ? 'plan' : 'done';
  return cur === 'plan' ? null : 'plan';
}

/* ---- Note box ---- */
let NOTE = null;
// The note box for a week: text or a number, plus an optional weekly step (Down/Up, Amount/%) for number notes.
// The step has its own buttons because phone number pads have no minus or % keys.
function noteModalHtml() {
  return `<div class="nmodal" id="nmodal" hidden><div class="nbox" role="dialog" aria-modal="true" aria-labelledby="nmTitle">
    <h2 id="nmTitle"></h2><p class="hint" id="nmInfo"></p>
    <label class="f">Note or number<input id="nmText" maxlength="40" placeholder="e.g. 77, 3h, 80%" autocomplete="off"></label>
    <div class="f" style="margin-top:10px">Change each following week <span style="font-weight:400">(optional)</span>
      <div class="stepbox">
        <div class="seg" id="nmDir"><button type="button" data-act="nmDir" data-d="-1">− Down</button><button type="button" data-act="nmDir" data-d="1">+ Up</button></div>
        <input id="nmStep" inputmode="decimal" placeholder="e.g. 0.5" autocomplete="off" aria-label="How much each week">
        <div class="seg" id="nmUnit"><button type="button" data-act="nmUnit" data-u="num">Amount</button><button type="button" data-act="nmUnit" data-u="pct">%</button></div>
      </div></div>
    <p class="hint" id="nmPreview" style="margin:8px 0 0"></p>
    <div class="row nbtns"><button class="btn" data-act="nmRemove" id="nmRemove">Remove</button><span style="flex:1"></span><button class="btn" data-act="nmCancel">Cancel</button><button class="btn primary" data-act="nmSave">Save</button></div>
  </div></div>`;
}
function openNote(td) {
  const g = D.goals.find(x => x.id === td.dataset.g); if (!g) return;
  const k = td.dataset.k, typed = (g.notes || {})[k], cn = goalCellNotes(g)[k];
  const st = parseStep(typed != null ? (g.steps || {})[k] : cn && cn.auto ? cn.step : null);
  NOTE = { gid: g.id, k, dir: st && st.v > 0 ? 1 : -1, pct: !!(st && st.pct) };
  const m = document.getElementById('nmodal');
  document.getElementById('nmTitle').textContent = (g.name || 'Goal') + ' · week of ' + fmtDate(k);
  document.getElementById('nmInfo').textContent = cn && cn.auto
    ? `This week shows ${cn.text}, counted on from ${fmtNum(cn.start)} on ${fmtDate(cn.from)} (${fmtStep(cn.step)} a week). Saving here starts from this week instead.`
    : 'Short text shows best in the cell (about 4 characters).';
  document.getElementById('nmText').value = typed != null ? typed : (cn ? cn.text : '');
  document.getElementById('nmStep').value = st ? fmtNum(Math.abs(st.v)) : '';
  document.getElementById('nmRemove').hidden = typed == null;
  m.hidden = false; noteButtons(); notePreview();
  setTimeout(() => { const t = document.getElementById('nmText'); t.focus(); t.select(); }, 30);
}
function noteButtons() {
  document.querySelectorAll('#nmDir button').forEach(b => b.classList.toggle('on', Number(b.dataset.d) === NOTE.dir));
  document.querySelectorAll('#nmUnit button').forEach(b => b.classList.toggle('on', (b.dataset.u === 'pct') === NOTE.pct));
}
/** The weekly change from the box: '' for none, NaN if not a number, else a number or "N%" (a minus typed on a keyboard flips the direction). */
function noteStep() {
  const raw = document.getElementById('nmStep').value.trim().replace(/%$/, '');
  if (!raw) return '';
  const v = evalAmount(raw); if (Number.isNaN(v) || v === '') return NaN;
  if (v === 0) return '';
  const signed = v < 0 ? v : v * NOTE.dir;
  return NOTE.pct ? (signed <= -100 ? NaN : signed + '%') : signed;
}
function closeNote() { NOTE = null; const m = document.getElementById('nmodal'); if (m) m.hidden = true; }
// Live preview of what the next weeks will read with the chosen step.
function notePreview() {
  const p = document.getElementById('nmPreview'); if (!p || !NOTE) return;
  const text = document.getElementById('nmText').value, start = noteNum(text), step = noteStep(), unit = /%\s*$/.test(text) ? '%' : '';
  if (Number.isNaN(step)) { p.textContent = NOTE.pct ? 'Use a number for the weekly change, under 100%.' : 'The weekly change must be a number, like 0.5.'; return; }
  if (step !== '' && start == null) { p.textContent = 'A weekly change needs a number in the note.'; return; }
  p.textContent = step !== '' ? `Next weeks: ${[1, 2, 3].map(n => fmtNum(stepValue(start, step, n)) + unit).join(', ')}, …` : '';
}
function saveNote(remove) {
  if (!NOTE) return;
  const g = D.goals.find(x => x.id === NOTE.gid); if (!g) return closeNote();
  const k = NOTE.k, text = document.getElementById('nmText').value.trim().slice(0, 40), step = noteStep();
  if (!remove && step !== '') {
    if (Number.isNaN(step)) return toast(NOTE.pct ? 'Use a number for the weekly change, under 100%.' : 'The weekly change must be a number, like 0.5.', true);
    if (noteNum(text) == null) return toast('A weekly change needs a number in the note.', true);
  }
  g.notes = Object.assign({}, g.notes); g.steps = Object.assign({}, g.steps);
  if (remove || !text) { delete g.notes[k]; delete g.steps[k]; }
  else { g.notes[k] = text; if (step !== '') g.steps[k] = step; else delete g.steps[k]; }
  closeNote(); repaintGoals();
  gSave(g, remove || !text ? 'Note removed' : step !== '' ? 'Saved — ' + fmtStep(step) + ' each week' : 'Note saved');
}
app.addEventListener('input', e => { if (e.target.id === 'nmText' || e.target.id === 'nmStep') notePreview(); });
app.addEventListener('keydown', e => {
  if (!NOTE) return;
  if (e.key === 'Escape') { e.preventDefault(); closeNote(); }
  if (e.key === 'Enter' && (e.target.id === 'nmText' || e.target.id === 'nmStep')) { e.preventDefault(); e.stopPropagation(); saveNote(false); }
}, true);
app.addEventListener('click', e => { if (e.target.id === 'nmodal') closeNote(); }); // tap outside the box closes it

// Applies the current brush to one week while painting (drag across weeks to paint many).
function gApply(k) {
  const g = D.goals.find(x => x.id === GPAINT.id); if (!g) return;
  GPAINT.last = k;
  if (GPAINT.val) g.marks[k] = GPAINT.val; else delete g.marks[k];
  repaintGoals();
}
// Goal saves wait for a short pause in tapping, then save the goal once (one call instead of one per tapped week).
const GTIMER = {};
function addGoal(grp) {
  const g = { id: cid(), name: '', color: nextGoalColor(), grp: grp || '', hidden: false, order: D.goals.reduce((m, x) => Math.max(m, x.order), -1) + 1, marks: {}, notes: {}, steps: {} };
  D.goals.push(g); pendingFocus = 'g|' + g.id + '|name'; render(); if (grp) toast('Added to "' + grp + '"');
  api('saveGoal', JSON.parse(JSON.stringify(g))).catch(fail);
}
function gSave(g, msg) {
  // wait for a pause in tapping, then save the goal as it is at that moment
  clearTimeout(GTIMER[g.id]);
  GTIMER[g.id] = setTimeout(() => {
    delete GTIMER[g.id];
    const cur = D.goals.find(x => x.id === g.id); if (!cur) return;
    api('saveGoal', JSON.parse(JSON.stringify(cur))).then(() => { if (msg) toast(msg); }).catch(fail);
  }, 400);
}

app.addEventListener('pointerdown', e => {
  const td = e.target.closest('td.gc'); if (!td) return;
  GPTR = e.pointerType;
  if (e.pointerType === 'touch' || GBRUSH === 'note') return; // phones: tap to mark (on click) so swiping still scrolls; notes open on click
  e.preventDefault();
  const g = D.goals.find(x => x.id === td.dataset.g); if (!g) return;
  const cur = g.marks[td.dataset.k];
  GPAINT = { id: g.id, val: brushResult(cur), last: null, y: td.closest('.gwrap').dataset.y };
  gApply(td.dataset.k);
});
document.addEventListener('pointermove', e => {
  if (!GPAINT) return;
  const el = document.elementFromPoint(e.clientX, e.clientY), td = el && el.closest('td.gc');
  if (td && td.dataset.g === GPAINT.id && td.dataset.k !== GPAINT.last && td.closest('.gwrap').dataset.y === GPAINT.y) gApply(td.dataset.k);
});
document.addEventListener('pointerup', () => {
  if (!GPAINT) return;
  const g = D.goals.find(x => x.id === GPAINT.id); GPAINT = null;
  if (g) gSave(g, 'Saved');
});
app.addEventListener('click', e => {
  const td = e.target.closest('td.gc'); if (!td) return;
  if (GBRUSH === 'note') return openNote(td);
  if (GPTR !== 'touch') return;
  const g = D.goals.find(x => x.id === td.dataset.g); if (!g) return;
  const cur = g.marks[td.dataset.k];
  GPAINT = { id: g.id, val: brushResult(cur), last: null };
  gApply(td.dataset.k); GPAINT = null;
  gSave(g, 'Saved');
});
app.addEventListener('input', e => {
  if (e.target.dataset.act !== 'gColor') return;
  const g = D.goals.find(x => x.id === e.target.dataset.id); if (!g) return;
  g.color = e.target.value;
  document.querySelectorAll(`tr[data-gid="${g.id}"]`).forEach(tr => tr.style.setProperty('--c', g.color)); // every year card
});

// Button actions for the Recurring and Goals pages and a few general ones (looked up by data-act).
const ACTIONS_EXTRA = {
  rgAdd: el => {
    const type = el.dataset.type, id = cid(), start = periodOf(today());
    const g = { id, name: type === 'income' ? 'Salary' : 'New group', type, start, end: '', order: D.recGroups.reduce((m, x) => Math.max(m, x.order), -1) + 1, freq: '', skip: [] };
    pendingFocus = 'rg|' + id + '|name';
    saveGroup(g, 'Group added from ' + periodLabel(start)); pushUndo('new group', () => undoDropGroup(id)); render();
  },
  rgDedupe: el => {
    const g = D.recGroups.find(x => x.id === el.dataset.id), ds = groupDuplicates(g);
    const list = ds.slice(0, 12).map(l => `• ${periodLabel(l.period)}: ${(IDX.cat[l.categoryId] || {}).name}${l.note ? ' (' + l.note + ')' : ''} ${l.planned != null ? money(l.planned, l.currency) : ''}${l.actual != null ? ', actual ' + money(l.actual, l.currency) : ''}`).join('\n');
    if (!confirm(`Delete these ${ds.length} line(s)? "${g.name}" will cover those months instead.\n\n${list}${ds.length > 12 ? '\n…and ' + (ds.length - 12) + ' more' : ''}`)) return;
    const ids = new Set(ds.map(l => l.id)), prevs = cp(ds); pushUndo('removing duplicates', () => prevs.forEach(undoPutLine));
    D.lines = D.lines.filter(l => !ids.has(l.id)); render();
    api('deleteLines', [...ids]).then(() => toast('Removed ' + ds.length + ' duplicate line' + (ds.length > 1 ? 's' : ''))).catch(fail);
  },
  rgDup: el => {
    const g = D.recGroups.find(x => x.id === el.dataset.id), nid = cid(), map = {};
    const copy = Object.assign({}, g, { id: nid, name: 'Copy of ' + g.name, start: '', end: '', skip: [], order: D.recGroups.reduce((m, x) => Math.max(m, x.order), -1) + 1 });
    const items = D.recItems.filter(i => i.groupId === g.id).map(i => { const id = cid(); map[i.id] = id; return Object.assign({}, i, { id, groupId: nid }); });
    D.recGroups.push(copy); items.forEach(i => D.recItems.push(i)); pushUndo('copy of ' + g.name, () => undoDropGroup(nid)); render();
    api('duplicateRecGroup', g.id, nid, map).then(() => toast('Copied — pick a start month for the copy')).catch(fail);
  },
  rgDel: el => {
    const g = D.recGroups.find(x => x.id === el.dataset.id);
    if (!confirm(`Delete "${g.name}" and its items from every month, including past months?\nTo keep past months as they are, set "Until" instead.`)) return;
    const ids = new Set(D.recItems.filter(i => i.groupId === g.id).map(i => i.id));
    const pg = cp(g), pis = cp(D.recItems.filter(i => i.groupId === g.id)), pls = cp(D.lines.filter(l => l.skip && ids.has(l.recurId)));
    pushUndo('deleting ' + g.name, () => { saveGroup(pg); pis.forEach(i => saveItem(i)); pls.forEach(undoPutLine); });
    D.lines = D.lines.filter(l => !(l.skip && ids.has(l.recurId))); D.recItems = D.recItems.filter(i => i.groupId !== g.id); D.recGroups = D.recGroups.filter(x => x.id !== g.id);
    render(); api('deleteRecGroup', g.id).then(() => toast('Group deleted')).catch(fail);
  },
  rgSkip: el => openSkip(el.dataset.id),
  skTog: el => {
    const g = Object.assign({}, D.recGroups.find(x => x.id === SKIPG)), sk = gSkip(g), k = el.dataset.k;
    if (sk.has(k)) sk.delete(k); else sk.add(k);
    g.skip = [...sk].sort(); putRow(D.recGroups, g); paintSkip();
    clearTimeout(SKTIMER); SKTIMER = setTimeout(() => saveGroup(D.recGroups.find(x => x.id === g.id), 'Saved'), 500); // save after a pause in tapping
  },
  skClear: () => {
    const g = Object.assign({}, D.recGroups.find(x => x.id === SKIPG), { skip: [] }); putRow(D.recGroups, g); paintSkip();
    clearTimeout(SKTIMER); SKTIMER = setTimeout(() => saveGroup(g, 'Saved'), 300);
  },
  skDone: () => closeSkip(),
  riAdd: el => {
    const g = D.recGroups.find(x => x.id === el.dataset.id), cat = defaultCat(g.type, g.name);
    if (!cat) return toast(`Add an ${g.type} category in Settings first.`, true);
    const id = cid();
    const it = { id, groupId: g.id, name: '', categoryId: cat, currency: 'USD', rate: 1, amount: null, week: gFreq(g) === 'weekly' ? 'every' : '', order: D.recItems.reduce((m, x) => Math.max(m, x.order), -1) + 1, note: '', active: true };
    pendingFocus = 'ri|' + id + '|name';
    saveItem(it); pushUndo('new item', () => undoDropItem(id)); render();
  },
  riDel: el => {
    const it = D.recItems.find(x => x.id === el.dataset.id);
    if (!confirm(`Delete "${it.name || 'this item'}" from every month the group covers?`)) return;
    const pi = cp(it), pls = cp(D.lines.filter(l => l.skip && l.recurId === it.id));
    pushUndo('deleting ' + (it.name || 'item'), () => { saveItem(pi); pls.forEach(undoPutLine); });
    D.lines = D.lines.filter(l => !(l.skip && l.recurId === it.id)); D.recItems = D.recItems.filter(i => i.id !== it.id);
    render(); api('deleteRecItem', it.id).then(() => toast('Item deleted')).catch(fail);
  },
  jump: el => jumpTo(el.dataset.id),
  toTop: () => toTop(),
  privToggle: () => setPrivate(!PRIV),
  lookSet: el => {
    const glass = el.dataset.v === 'glass';
    try { localStorage.setItem('tracker-look', glass ? 'glass' : 'classic'); } catch (e) {}
    applyTheme(); render(); toast(glass ? 'Glass look on' : 'Classic look on');
  },
  nightSet: el => {
    const v = el.dataset.v;
    try { localStorage.setItem('tracker-night', v); } catch (e) {}
    applyTheme(); render(); toast(v === 'on' ? 'Night mode on' : v === 'auto' ? 'Night mode follows your device' : 'Night mode off');
  },
  pEdit: () => { PEDIT = !PEDIT; render(); },
  pstartReset: el => setPeriodStart(el.dataset.k, ''),
  pstartAdd: () => { const v = val('ps_new'); if (!v) return toast('Pick a date first.', true); setPeriodStart(v.slice(0, 7), v); },
  bweek: el => { BWEEK[PERIOD] = el.dataset.k; render(); },
  gYearToggle: el => {
    const y = +el.dataset.y, on = GYEARS.includes(y);
    if (on && GYEARS.length === 1) return toast('Keep at least one year showing.', true);
    GYEARS = on ? GYEARS.filter(x => x !== y) : GYEARS.concat(y).sort();
    saveYears(); GLAST = {}; GSCROLL = on ? 'today' : { year: y }; render();
  },
  gThisMonth: () => {
    const y = today().getFullYear();
    if (!GYEARS.includes(y)) { GYEARS = GYEARS.concat(y).sort((a, b) => a - b); saveYears(); GSCROLL = 'today'; render(); }
    gScrollMonth();
  },
  gYears: () => openYears(),
  yClose: () => { document.getElementById('ymodal').hidden = true; },
  yAdd: () => {
    const v = document.getElementById('yNew').value.trim(), y = Number(v);
    if (!/^\d{4}$/.test(v) || y < 2000 || y > 2100) return toast('Type a 4-digit year, like 2029.', true);
    saveYearLists(addedYears().concat(y), removedYears().filter(x => x !== y), () => {
      if (!GYEARS.includes(y)) { GYEARS = GYEARS.concat(y).sort((a, b) => a - b); saveYears(); }
      GLAST = {}; GSCROLL = { year: y }; render(); openYears(); toast('Added ' + y);
    });
  },
  yRemove: el => {
    const y = Number(el.dataset.y);
    saveYearLists(addedYears().filter(x => x !== y), removedYears().concat(y), () => {
      GYEARS = GYEARS.filter(x => x !== y); if (!GYEARS.length) GYEARS = [today().getFullYear()]; saveYears();
      GLAST = {}; GSCROLL = 'today'; render(); openYears(); toast('Removed ' + y);
    });
  },


  nmSave: () => saveNote(false),
  nmDir: el => { NOTE.dir = Number(el.dataset.d); noteButtons(); notePreview(); },
  nmUnit: el => { NOTE.pct = el.dataset.u === 'pct'; noteButtons(); notePreview(); },
  nmRemove: () => saveNote(true),
  nmCancel: () => closeNote(),
  gBrush: el => { GBRUSH = el.dataset.b; document.querySelectorAll('[data-act="gBrush"]').forEach(b => b.classList.toggle('on', b === el)); },
  gAdd: () => addGoal(''),
  gAddIn: el => addGoal(el.dataset.name),
  gNewGroup: () => {

    if (f === 'categoryId') CATOPEN.add(catType({ categoryId: v }) + '|' + v);

    if (String(vl[f] == null ? '' : vl[f]) === String(v == null ? '' : v)) return; // nothing changed
    D.lines.push(row); FIDMAP = ['l|' + vl.id + '|', 'l|' + row.id + '|'];
    pushUndo('change to ' + lineName(vl), () => undoDropLines([row.id]));
    setTimeout(render, 0);
    const key = 'l|' + row.id;
    tracked(key, api('saveLine', lineOut(row))).then(saved => {
      if (PENDING[key]) return;
      const j = D.lines.findIndex(x => x.id === saved.id); if (j < 0) return;
      D.lines[j] = saved; render(); toast('Changed for this month only');
    }).catch(fail);
    return;
  }
  const l = D.lines.find(x => x.id === el.dataset.id); if (!l) return;
  if (f === 'categoryId') CATOPEN.add(catType({ categoryId: v }) + '|' + v);
  const upd = Object.assign({}, l, { [f]: v });
  if (f === 'currency' && v !== l.currency) upd.rate = rateOf(v);
  if (String(l[f] == null ? '' : l[f]) !== String(v == null ? '' : v)) { const prev = cp(l); pushUndo('change to ' + lineName(l), () => undoPutLine(prev)); }
  Object.assign(l, upd);
  setTimeout(render, 0);
  const key = 'l|' + l.id;
  tracked(key, api('saveLine', lineOut(upd)))
    .then(row => {
      if (PENDING[key]) return; // a newer edit to this line is still on its way
      const j = D.lines.findIndex(x => x.id === row.id); if (j < 0) return; // deleted meanwhile
      D.lines[j] = row; render(); toast('Saved');
    })
    .catch(fail);
}

// New line. "+ Add income/expense" first asks which category (a new line used to land in the first category, which
// meant moving it every time). Once picked, the line is created in that category, the category opens, and the cursor
// sits in Planned so you can type the amount right away.
let CATPICK = null; // 'income' | 'expense' while the category box is open

// Moving a line to another week or month (the ⇄ button).
// - Same month: only its "When" changes.
// - Another month, a line you typed: the line itself moves (its period changes).
// - Another month, a recurring line: the recurring item stays where it is (it repeats every month anyway), so the move
//   = "skip it this month" + "add a one-off copy in the other month". Otherwise the target month would end up with the item
//   twice, or lose its own copy.
// The amount moves as it is; for "Every week" lines that's the per-week amount.
let MOVE = null; // { id, k, week } while the move box is open
function openMove(id) {
  const l = linesFor(PERIOD).find(x => x.id === id); if (!l) return;
  MOVE = { id, k: PERIOD, week: l.week || '' }; render();
}
function closeMove() { MOVE = null; const m = document.getElementById('mvmodal'); if (m) m.hidden = true; }
function moveModalHtml() {
  if (!MOVE) return '';
  const l = linesFor(PERIOD).find(x => x.id === MOVE.id); if (!l) { MOVE = null; return ''; }
  const months = []; for (let i = -6; i <= 12; i++) months.push(nextKey(PERIOD, i));
  const weeks = weeksOf(MOVE.k), name = lineName(l);
  const chips = [['', 'Whole month'], ['every', 'Every week']].concat(weeks.map((w, i) => [String(i + 1), `W${i + 1}`, fmtDay(w.start)]));
  const same = MOVE.k === PERIOD && (MOVE.week || '') === (l.week || '');
  const where = (MOVE.week === '' ? 'whole month' : MOVE.week === 'every' ? 'every week' : 'W' + MOVE.week) + ' of ' + periodLabel(MOVE.k);
  return `<div class="nmodal" id="mvmodal"><div class="nbox skbox" role="dialog" aria-modal="true" aria-labelledby="mvTitle">
    <h2 id="mvTitle">Move “${esc(name)}”</h2>
    <p class="hint">${l.recurId ? 'This comes from a recurring group. Moving it to another month skips it here and adds a one-off copy there; other months stay as they are.' : 'Pick the month and the week it should count in.'}</p>
    <div class="skrow"><b>Month</b><select data-act="mvMonth">${months.map(k => `<option value="${k}" ${k === MOVE.k ? 'selected' : ''}>${periodLabel(k)}${k === PERIOD ? ' (this one)' : ''}</option>`).join('')}</select></div>
    <div class="skrow"><b>When</b><div class="skchips">${chips.map(([v, n, d]) => `<button data-act="mvWeek" data-v="${v}" class="${(MOVE.week || '') === v ? 'sel' : ''}">${n}${d ? `<small>${d}</small>` : ''}</button>`).join('')}</div></div>
    <p class="mvsum">${same ? '<span class="muted">Pick a different week or month.</span>' : `Moves to <b>${where}</b>.`}</p>
    <div class="row nbtns"><span style="flex:1"></span><button class="btn" data-act="mvCancel">Cancel</button><button class="btn primary" data-act="mvDo" ${same ? 'disabled' : ''}>Move</button></div></div></div>`;
}
function moveLine(id, k, week) {
  const l = linesFor(PERIOD).find(x => x.id === id); if (!l) return;
  const label = (week === '' ? 'whole month' : week === 'every' ? 'every week' : 'W' + week) + (k === PERIOD ? '' : ' of ' + periodLabel(k));
  if (k === PERIOD) { saveLineField({ dataset: { id, field: 'week' }, value: week }); return toast('Moved to ' + label); }
  const name = lineName(l);
  if (!l.recurId) {
    // a line you typed: move it
    const real = D.lines.find(x => x.id === id), prev = cp(real);
    Object.assign(real, { period: k, week });
    pushUndo('moving ' + name, () => undoPutLine(prev));
    render();
    bgSave('l|' + id, api('saveLine', lineOut(real)), saved => putRow(D.lines, saved), 'Moved to ' + label);
    return;
  }
  // a recurring line: skip it here, add a one-off copy there
  const copy = { id: cid(), period: k, categoryId: l.categoryId, note: name, currency: l.currency, rate: l.rate, planned: l.planned, actual: l.actual, week, recurId: '', skip: false };
  let undoSkip;
  if (l.virtual) {
    const skipRow = Object.assign({}, l, { id: cid(), skip: true }); delete skipRow.virtual; delete skipRow.only; delete skipRow.recNote;
    D.lines.push(skipRow); undoSkip = () => undoDropLines([skipRow.id]);
    api('saveLine', lineOut(skipRow)).catch(fail);
  } else {
    const real = D.lines.find(x => x.id === id), prev = cp(real);
    Object.assign(real, { skip: true }); undoSkip = () => undoPutLine(prev);
    api('saveLine', lineOut(real)).catch(fail);
  }
  D.lines.push(copy);
  pushUndo('moving ' + name, () => { undoDropLines([copy.id]); undoSkip(); });
  render();
  bgSave('l|' + copy.id, api('saveLine', lineOut(copy)), saved => putRow(D.lines, saved), 'Moved to ' + label);
}
function openCatPick(type) {
  if (!D.categories.some(x => x.type === type && x.active)) return toast(`Add an ${type} category in Settings first.`, true);
  CATPICK = type; render();
}
function closeCatPick() { CATPICK = null; const m = document.getElementById('cpmodal'); if (m) m.hidden = true; }
// The box: active categories of that type under their group, with how many lines each already has this month.
function catPickHtml() {
  if (!CATPICK) return '';
  const type = CATPICK, cs = D.categories.filter(c => c.type === type && c.active).sort(byOrder);
  const used = {}; linesFor(PERIOD).forEach(l => { used[l.categoryId] = (used[l.categoryId] || 0) + 1; });
  const groups = [...new Set(cs.map(c => c.group || 'Other'))];
  return `<div class="nmodal" id="cpmodal"><div class="nbox skbox" role="dialog" aria-modal="true" aria-labelledby="cpTitle">
    <h2 id="cpTitle">Add ${type === 'income' ? 'income' : 'an expense'} to…</h2><p class="hint">Pick a category for the new line in ${periodLabel(PERIOD)}.</p>
    ${groups.map(g => `<div class="skrow"><b>${esc(g)}</b><div class="skchips">${cs.filter(c => (c.group || 'Other') === g).map(c => `<button data-act="cpPick" data-id="${c.id}">${esc(c.name)}${used[c.id] ? `<small>${used[c.id]} already</small>` : ''}</button>`).join('')}</div></div>`).join('')}
    <div class="row nbtns"><span style="flex:1"></span><button class="btn" data-act="cpCancel">Cancel</button></div></div></div>`;
}
function addLine(type, catId) {
  const c = D.categories.find(x => x.id === catId && x.type === type);
  if (!c) return openCatPick(type);
  const row = { id: cid(), period: PERIOD, categoryId: c.id, note: '', currency: 'USD', rate: 1, planned: null, actual: null, week: '', recurId: '', skip: false };
  D.lines.push(row); CATOPEN.add(type + '|' + c.id);
  pendingFocus = 'l|' + row.id + (LVIEW[type] === 'all' ? '|planned' : '|uplannedm'); // the By week grid has its own whole-month box
  pushUndo('new ' + type + ' line', () => undoDropLines([row.id])); render();
  const key = 'l|' + row.id;
  tracked(key, api('saveLine', lineOut(row))).then(saved => {
    if (PENDING[key]) return;
    const j = D.lines.findIndex(x => x.id === saved.id); if (j >= 0) D.lines[j] = saved;
  }).catch(fail);
}

// Settings rows (accounts, categories, targets): save and take the full reply.
function saveEntity(fn, list, el) {
  const obj = Object.assign({}, list.find(x => x.id === el.dataset.id));
  const f = el.dataset.field; let v = el.value;
  if (f === 'amount') { v = evalAmount(v); if (Number.isNaN(v) || v === '') return badNumber(); }
  obj[f] = v;
  run(api(fn, obj), 'Saved');
}

// Pay day, week start and currencies. Warns before changing the week start, since saved balances are tied to week dates.
function saveGeneral() {
  const p = parseInt(val('s_payday'), 10);
  if (!(p >= 1 && p <= 31)) return toast('Pay day must be a number from 1 to 31.', true);
  const obj = { payday: String(p), weekStart: val('s_week'), secondaryCurrency: val('s_sec'), currencies: val('s_curs') };
  if (obj.weekStart !== String(S().weekStart) && D.balances.length &&
      !confirm('Balances are saved against their week start date. Changing the week start day means balances you already entered won\'t line up with the new weeks. Change it anyway?')) return;
  run(api('saveSettings', obj), 'Settings saved');
}

// Button actions for the Month, Overview and Settings pages (looked up by data-act on the clicked element).
const ACTIONS = {
  prev: () => { PERIOD = nextKey(PERIOD, -1); render(); },
  next: () => { PERIOD = nextKey(PERIOD, 1); render(); },
  now: () => { PERIOD = periodOf(today()); render(); },
  goto: el => { PERIOD = el.dataset.k; TAB = 'month'; render(); window.scrollTo(0, 0); },
  addLine: el => openCatPick(el.dataset.type),
  cpPick: el => { const type = CATPICK; closeCatPick(); addLine(type, el.dataset.id); },
  cpCancel: () => closeCatPick(),
  lMove: el => openMove(el.dataset.id),
  mvWeek: el => { MOVE.week = el.dataset.v; render(); },
  mvCancel: () => closeMove(),
  mvDo: () => { const m = MOVE; closeMove(); moveLine(m.id, m.k, m.week); },
  delLine: el => {
    const id = el.dataset.id, l = linesFor(PERIOD).find(x => x.id === id); if (!l) return;
    if (l.recurId && (l.virtual || recInfo(l))) {
      // recurring: remove from this month only
      const ri = recInfo(l), name = (l.note || (ri && ri.item.name) || 'this item');
      if (!confirm(`Remove "${name}" from ${periodLabel(PERIOD)} only?\nIt stays in other months. To stop it for good, set "Until" on its group in the Recurring tab.`)) return;
      const row = l.virtual ? Object.assign({}, l, { id: cid(), skip: true }) : Object.assign({}, l, { skip: true });
      delete row.virtual; delete row.only; delete row.recNote;
      if (l.virtual) { D.lines.push(row); pushUndo('removing ' + name, () => undoDropLines([row.id])); }
      else { const real = D.lines.find(x => x.id === id), prev = cp(real); Object.assign(real, { skip: true }); pushUndo('removing ' + name, () => undoPutLine(prev)); }
      render();
      api('saveLine', lineOut(row)).then(() => toast('Removed from this month')).catch(fail);
      return;
    }
    if (!confirm('Delete this line?')) return;
    const prevL = cp(D.lines.find(x => x.id === id)); pushUndo('deleting ' + lineName(prevL), () => undoPutLine(prevL));
    D.lines = D.lines.filter(x => x.id !== id); render(); api('deleteLine', id).then(() => toast('Deleted')).catch(fail);
  },
  resetLine: el => {
    // undo this month's change to a recurring item
    const id = el.dataset.id, prevL = D.lines.find(x => x.id === id);
    if (prevL) { const pc = cp(prevL); pushUndo('reset of ' + lineName(pc), () => undoPutLine(pc)); }
    D.lines = D.lines.filter(x => x.id !== id); render();
    api('deleteLine', id).then(() => toast('Back to the recurring amount')).catch(fail);
  },
  undo: () => doUndo(),
  jumpTargets: () => { TAB = 'settings'; SECNAV = null; render(); setTimeout(() => jumpTo('targets'), 50); },
  forgetConn: () => { if (!confirm('Forget the address and key on this device? You’ll need to paste them again.')) return; try { localStorage.removeItem('tracker-conn'); } catch (e) {} location.reload(); },
  openCode: () => window.open(CODE_URL, '_blank', 'noopener'), // a new tab: the page itself runs inside Google's frame
  ovMode: el => { OVIEW.mode = el.dataset.v; render(); },
  ovAll: () => { OVIEW.from = OVIEW.to = ''; render(); },
  bview: el => { BVIEW = el.dataset.v; try { localStorage.setItem('tracker-bview', BVIEW); } catch (e) {} render(); },
  toRecurring: () => { TAB = 'recurring'; render(); window.scrollTo(0, 0); },
  catTog: el => { const k = el.dataset.c; if (CATOPEN.has(k)) CATOPEN.delete(k); else CATOPEN.add(k); render(); },
  lview: el => setLView(el.dataset.type, el.dataset.v),
  saveGeneral: () => saveGeneral(),
  accAdd: () => { const name = val('na_name').trim(); if (!name) return toast('Give the account a name.', true); run(api('saveAccount', { name, currency: val('na_cur'), active: true }), 'Account added'); },
  accArchive: el => { const a = D.accounts.find(x => x.id === el.dataset.id); run(api('saveAccount', Object.assign({}, a, { active: !a.active })), a.active ? 'Archived' : 'Restored'); },
  accDelete: el => { const a = D.accounts.find(x => x.id === el.dataset.id); if (confirm(`Delete "${a.name}" and every balance entered for it? This can't be undone. Archive it instead if you want to keep its history.`)) run(api('deleteAccount', a.id), 'Account deleted'); },
  catAdd: () => { const name = val('nc_name').trim(); if (!name) return toast('Give the category a name.', true); run(api('saveCategory', { name, type: val('nc_type'), group: val('nc_group').trim(), active: true }), 'Category added'); },
  catArchive: el => { const c = D.categories.find(x => x.id === el.dataset.id); run(api('saveCategory', Object.assign({}, c, { active: !c.active })), c.active ? 'Archived' : 'Restored'); },
  catDelete: el => { const c = D.categories.find(x => x.id === el.dataset.id); if (confirm(`Delete the "${c.name}" category?`)) run(api('deleteCategory', c.id), 'Category deleted'); },
  tgtAdd: () => {
    const name = val('nt_name').trim(), amount = evalAmount(val('nt_amount'));
    if (!name) return toast('Give the target a name.', true);
    if (Number.isNaN(amount) || amount === '' || amount <= 0) return toast('Enter the target amount.', true);
    run(api('saveTarget', { name, amount, currency: val('nt_cur'), date: val('nt_date'), note: '' }), 'Target added');
  },
  tgtDelete: el => { const x = D.targets.find(t => t.id === el.dataset.id); if (confirm(`Delete the "${x.name}" target?`)) run(api('deleteTarget', x.id), 'Target deleted'); }
};

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !D) return;
  if (b.dataset.tab === TAB) return toTop(); // tapping the tab you're on goes back to the top
  TAB = b.dataset.tab; SECNAV = null; render(); window.scrollTo(0, 0); showBar();
});
/* Back to top: tap the title bar (just under the iPhone clock) or the tab you're already on.
   The iPhone's own tap-the-clock shortcut can't reach the app, because Google shows it inside a frame. */
function toTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); showBar(); }
document.querySelector('.top').addEventListener('click', e => { if (!e.target.closest('button, a, input, select')) toTop(); });

/* Phone: the bottom tab bar stays in place while scrolling (it only steps aside while you drag a goal). */
const BAR = document.querySelector('.tabs');
let barTick = false;
function showBar() { BAR.classList.remove('away'); }
window.addEventListener('scroll', () => {
  if (barTick) return; barTick = true;
  requestAnimationFrame(() => { barTick = false; if (TAB === 'settings') markSection(); });
}, { passive: true });
// One click handler for the whole page: finds the nearest element with data-act and runs its action.
// Cheaper and simpler than attaching handlers to every button after each redraw.
function onAction(e) {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const fn = ACTIONS[el.dataset.act] || ACTIONS_EXTRA[el.dataset.act]; if (fn) fn(el);
}
app.addEventListener('click', onAction);
document.getElementById('tbar').addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('[data-act]')) onAction(e); else if (!e.target.closest('label, select')) toTop(); });
document.getElementById('undoFab').addEventListener('click', () => doUndo());
document.getElementById('tbar').addEventListener('change', e => { if (e.target.dataset.act) handleChange(e.target); });
app.addEventListener('change', e => {
  const el = e.target;
  // Typing a date with the keyboard fires "change" after each part (day, month, year), so dates save when you leave the field.
  if (el.type === 'date' && el.dataset.act && document.activeElement === el) return;
  handleChange(el);
});
app.addEventListener('focusout', e => {
  const el = e.target;
  if (el.type !== 'date' || !el.dataset.act) return;
  // Chrome also fires focusout when moving between the day/month/year parts, so check focus really left the box.
  setTimeout(() => { if (document.activeElement !== el && el.isConnected && el.value !== el.defaultValue) handleChange(el); }, 0);
});
// One change handler for every input/select (data-act says what it is). Runs when a box loses focus or Enter is
// pressed, not on every key, so each finished edit is one save and one Undo step.
function handleChange(el) {
  const act = el.dataset.act;
  if (act === 'bal') return saveBal(el);
  if (act === 'line') return saveLineField(el);
  if (act === 'acc') return saveEntity('saveAccount', D.accounts, el);
  if (act === 'cat') return saveEntity('saveCategory', D.categories, el);
  if (act === 'tgt') return saveEntity('saveTarget', D.targets, el);
  if (act === 'rate') { const v = evalAmount(el.value); if (Number.isNaN(v)) return badNumber(); return run(api('saveRate', el.dataset.cur, v === '' ? '' : v), 'Rate saved'); }
  if (act === 'pstart') return setPeriodStart(el.dataset.k, el.value);
  if (act === 'mvMonth') { MOVE.k = el.value; const n = weeksOf(MOVE.k).length; if (/^[1-5]$/.test(MOVE.week) && +MOVE.week > n) MOVE.week = String(n); return render(); }
  if (act === 'tgtMain') { D.settings.mainTarget = el.dataset.id; render(); return run(api('saveSettings', { mainTarget: el.dataset.id }), 'Main target set'); }
  if (act === 'ovTg') { OVIEW.tg = el.value; return render(); }
  if (act === 'wcur') { WCUR = el.value; try { localStorage.setItem('tracker-wcur', WCUR); } catch (e) {} return render(); }
  if (act === 'ovFrom' || act === 'ovTo') {
    OVIEW[act === 'ovFrom' ? 'from' : 'to'] = el.value;
    if (OVIEW.from && OVIEW.to && OVIEW.from > OVIEW.to) OVIEW[act === 'ovFrom' ? 'to' : 'from'] = el.value; // keep From before To
    return render();
  }
  if (act === 'lusd') {
    // A By week cell. The amount is in the grid's "Show in" currency, unless you add a code ("500 EGP" or "EGP 500").
    // It's converted into the line's own currency before saving.
    const l = linesFor(PERIOD).find(x => x.id === el.dataset.id); if (!l) return;
    let txt = el.value.trim(), inCur = el.dataset.cur || 'USD';
    const mc = txt.match(/^([A-Za-z]{3})\s*(.+)$/) || txt.match(/^(.+?)\s*([A-Za-z]{3})$/);
    if (mc) {
      const code = (/^[A-Za-z]{3}$/.test(mc[1]) ? mc[1] : mc[2]).toUpperCase();
      if (code !== 'USD' && !rateOf(code)) return toast('No exchange rate for ' + code + '. Add it in Settings → Currencies.', true);
      inCur = code; txt = /^[A-Za-z]{3}$/.test(mc[1]) ? mc[2] : mc[1];
    }
    const v = evalAmount(txt); if (Number.isNaN(v)) return badNumber();
    let native = v === '' ? '' : Math.abs(v);
    if (native !== '' && inCur !== l.currency) {
      const rIn = inCur === 'USD' ? 1 : rateOf(inCur);
      const rLine = l.currency === 'USD' ? 1 : (l.rate || rateOf(l.currency));
      if (!rIn || !rLine) return toast('No exchange rate for ' + (rIn ? l.currency : inCur) + ' yet.', true);
      native = r2(native * rIn / rLine);
    }
    return saveLineField({ dataset: { id: l.id, field: el.dataset.field }, value: String(native) });
  }
  if (act === 'rg' || act === 'ri') return saveRecField(el);
  if (act === 'riOn') {
    const prevI = cp(D.recItems.find(x => x.id === el.dataset.id)); pushUndo((el.checked ? 'switching on ' : 'switching off ') + (prevI.name || 'item'), () => saveItem(prevI));
    const it = Object.assign({}, D.recItems.find(x => x.id === el.dataset.id), { active: el.checked });
    setTimeout(render, 0); return saveItem(it, el.checked ? 'Counted again' : 'Switched off — not counted');
  }
  if (act === 'gmGroup') {
    if (el.value === '__new') { document.getElementById('gmNewWrap').hidden = false; document.getElementById('gmNew').focus(); return; }
    const id = GMENU; closeGoalMenu(); return setGoalGroup([id], el.value);
  }
  if (act === 'gSel') { if (el.checked) GSEL.add(el.dataset.id); else GSEL.delete(el.dataset.id); return render(); }
  if (act === 'gSelGrp') {
    const grp = goalLayout().find(x => x.name === el.dataset.name); if (!grp) return;
    grp.goals.forEach(g => { if (el.checked) GSEL.add(g.id); else GSEL.delete(g.id); }); return render();
  }
  if (act === 'gsGroup') {
    let name = el.value; if (!name) return;
    if (name === '__new') { name = (window.prompt('Name of the new group:', '') || '').trim().slice(0, 60); if (!name) { el.value = ''; return; } }
    const ids = [...GSEL]; GSEL = null; return setGoalGroup(ids, name === '__none' ? '' : name);
  }
  if (act === 'gGroupName') {
    const old = el.dataset.old, name = el.value.trim().slice(0, 60);
    if (name === old) return;
    if (!name && !confirm(`Remove the group "${old}"? Its goals stay, just without a group.`)) { el.value = old; return; }
    const L = goalLayout(), from = L.find(x => x.name === old); if (!from) return;
    // an empty name takes the goals out of the group; a name that already exists merges the two groups
    let into = L.find(x => x !== from && x.name === name);
    if (!into && !name) { into = { name: '', goals: [] }; L.unshift(into); }
    if (into) { into.goals = into.goals.concat(from.goals); L.splice(L.indexOf(from), 1); }
    else from.name = name;
    return applyLayout(L, !name ? 'Group removed' : into ? 'Merged into "' + name + '"' : 'Group renamed');
  }
  if (act === 'gName' || act === 'gColor') {
    const g = D.goals.find(x => x.id === el.dataset.id); if (!g) return;
    if (act === 'gName') g.name = el.value; else g.color = el.value;
    return gSave(g, 'Saved');
  }
}
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.dataset.act) e.target.blur(); });
// Ctrl/Cmd+Z undoes the last change (when you're not typing in a box, where it undoes the typing instead)
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.shiftKey || e.altKey || e.key.toLowerCase() !== 'z') return;
  if (TAB !== 'month' && TAB !== 'recurring') return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  e.preventDefault(); doUndo();
});

if (USE_MOCK) document.getElementById('mode').hidden = false;
/* Connect screen (own site only): your web-app address and app key, kept in this browser. Shown on first visit, and
   again if the key stops working (e.g. you made a new one), so you're never stuck on an error. */
function connectHtml(err) {
  const c = conn() || {};
  return `<div class="card connect"><h2>Connect to your sheet</h2>
    <p class="hint">Once per device. Both come from Apps Script: the web-app address (Deploy → Manage deployments, ends in <b>/exec</b>) and the key printed by <b>createAppKey</b>.</p>
    ${err ? `<p class="cerr">${esc(err)}</p>` : ''}
    <label class="f"><span>Web-app address</span><input id="cnUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(c.url || '')}" autocomplete="off"></label>
    <label class="f"><span>App key</span><input id="cnKey" type="password" placeholder="Paste your key" value="${esc(c.key || '')}" autocomplete="off"></label>
    <div class="row"><button class="btn primary" id="cnGo">Connect</button><button class="btn" id="cnDemo">Try with sample data</button></div></div>`;
}
function showConnect(err) {
  document.body.classList.add('noconn'); // no page tabs until there's data to show
  app.innerHTML = connectHtml(err);
  document.getElementById('cnGo').onclick = () => {
    const url = val('cnUrl').trim(), key = val('cnKey').trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url)) return showConnect('That address should start with https://script.google.com and end with /exec.');
    if (!key) return showConnect('Paste your app key.');
    try { localStorage.setItem('tracker-conn', JSON.stringify({ url, key })); } catch (e) {}
    app.innerHTML = '<div class="loading">Connecting…</div>'; start();
  };
  document.getElementById('cnDemo').onclick = () => { try { sessionStorage.setItem('tracker-demo', '1'); } catch (e) {} location.reload(); };
}
function start() {
  if (HOSTED && !USE_MOCK && !conn()) return showConnect();
  api('getData')
    .then(d => { D = d; PERIOD = periodOf(today()); document.body.classList.remove('noconn'); render(); })
    .catch(e => {
      if (HOSTED && !USE_MOCK) return showConnect(errMsg(e));
      app.innerHTML = `<div class="loading">Couldn't load your data: ${esc(errMsg(e))}</div>`;
    });
}
start();
</script>
</body>
</html>
