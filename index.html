  document.getElementById('privBadge').hidden = !PRIV;
  paintUndo();
  document.documentElement.style.setProperty('--hdr', hdrHeight() + 'px');
  if (fid && FIDMAP && fid.indexOf(FIDMAP[0]) === 0) fid = FIDMAP[1] + fid.slice(FIDMAP[0].length);
  FIDMAP = null;
  if (fid) {
    const n = [...app.querySelectorAll('[data-fid]')].find(x => x.dataset.fid === fid);
    if (n) { n.focus({ preventScroll: true }); if (val != null && n.tagName === 'INPUT' && n.value !== val) n.value = val; try { if (ss != null) n.setSelectionRange(ss, se); } catch (_) {} }
  }
  if (TAB === 'goals') {
    const w = document.querySelector('.gwrap'), last = GLAST.all;
    if (GSCROLL && GSCROLL.year) gScrollYear(GSCROLL.year);
    else if (GSCROLL === 'start') PHONE ? gScrollWeek() : gScrollMonth(true);
    else if (GSCROLL === 'month') gScrollMonth(true);
    else if (GSCROLL === 'today' || !last) gScrollToday(false);
    else if (w) { w.scrollLeft = last[0]; w.scrollTop = last[1]; }
    GSCROLL = null;
  }
}
let GLAST = {};

/* The page's own controls (period, years, brushes, section links) live in the top bar to save room. */
function topBarHtml() {
  if (TAB === 'month') {
    const t = today();
    return `<div class="pnav"><button class="btn icon" data-act="prev" title="Previous period">‹</button>
      <div><div class="pl">${periodLabel(PERIOD)}</div><div class="pr">${periodRange(PERIOD)} · ${weeksOf(PERIOD).length} weeks</div></div>
      <button class="btn icon" data-act="next" title="Next period">›</button>
      ${PERIOD !== periodOf(t) ? `<button class="btn" data-act="now" title="Go to the current period">Today</button>` : ''}
      <button class="btn${PEDIT ? ' on' : ''}" data-act="pEdit">${PEDIT ? 'Done' : 'Start date'}</button>${undoBtnHtml()}</div>`;
  }
  if (TAB === 'recurring') return PHONE ? '' : `<div class="pnav">${undoBtnHtml()}</div>`;
  if (TAB === 'goals') return goalToolHtml();
  if (TAB === 'overview') return ovToolHtml();
  if (TAB === 'settings') return `<nav class="secnav">${SECTIONS.map(([id, n]) => `<button data-act="jump" data-id="${id}" class="${(SECNAV || 'privacy') === id ? 'on' : ''}">${n}</button>`).join('')}</nav>`;
  return '';
}
// Desktop: try the page's controls on one row with the title and tabs; if they don't fit drop the title; if they still
// don't fit give them their own row. Measured after drawing, because button widths depend on the font and the data.
function renderTopBar() {
  const bar = document.getElementById('tbar'), top = document.querySelector('.top'), x = bar.scrollLeft, html = topBarHtml();
  bar.innerHTML = html; bar.scrollLeft = x;
  top.classList.toggle('has-tbar', !!html);
  // on a computer: one row if everything fits, otherwise the controls get a row of their own under the title and tabs
  // on a computer: first try one row; if the controls don't fit, drop the title; if they still don't, give them a row of their own
  // Steps, each only if still too tight: drop the title → give the controls their own row (title back).
  // The tab icons always stay (an earlier version hid them first, and they kept vanishing when switching pages).
  top.classList.remove('two', 'notitle');
  const tight = () => bar.scrollWidth > bar.clientWidth + 1;
  if (html && !PHONE && tight()) { top.classList.add('notitle'); if (tight()) { top.classList.remove('notitle'); top.classList.add('two'); } }
  document.documentElement.style.setProperty('--hdr', hdrHeight() + 'px');
}
window.addEventListener('resize', () => { if (D) renderTopBar(); });

// A summary box (label, big number, small lines under it).
const kpi = (label, value, subs) => `<div class="kpi"><div class="l">${label}</div><div class="v">${value}</div><div class="s">${subs.filter(Boolean).join('<br>')}</div></div>`;
const curOpts = sel => currencies([sel]).map(c => `<option ${c === sel ? 'selected' : ''}>${c}</option>`).join('');
// Category picker grouped by its Group, keeping an archived category in the list only for rows that already use it.
function catOpts(type, sel) {
  const cs = D.categories.filter(c => c.type === type && (c.active || c.id === sel)).sort(byOrder);
  const groups = [...new Set(cs.map(c => c.group || 'Other'))];
  return groups.map(g => `<optgroup label="${esc(g)}">${cs.filter(c => (c.group || 'Other') === g).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
}

/* ---------- Month ---------- */
// Month page, top to bottom: summary boxes, week-by-week plan vs actual, targets, account balances, income, expenses.
// Boxes name the actual months ('Change since October') instead of 'this/last period', which was confusing. The Planned box shows
// where the balance should be by the current week (from the weekly amounts), so you can check yourself mid-month, not only at the end.
function renderMonth() {
  const M = metrics(PERIOD), m = M[PERIOD], t = today();
  const missing = missingRates();
  let h = '';
  if (PEDIT) h += pstartHtml(PERIOD);
  if (missing.length) h += `<div class="warn">No exchange rate yet for <b>${missing.join(', ')}</b>, so those amounts can't be converted to USD. Add a rate in Settings → Rates.</div>`;

  const mon = k => MONTHS[+k.slice(5) - 1], prevK = nextKey(PERIOD, -1);
  const tw = m.weeks.find(w => w.start <= t && t <= w.end); // the week you're in, if it's in this period
  if (PRIV) {
    h += '<div class="kpis">' +
      kpi('Spent in ' + mon(PERIOD), money(m.spend), [m.spend == null ? 'Worked out from your balances once they are in' : '', secTxt(m.spend)]) +
      kpi('Planned expenses', money(m.pExp), [m.spend != null && m.pExp ? `Spent is <b>${pct(m.spend / m.pExp)}</b> of plan` : '', secTxt(m.pExp)]) +
      kpi('Logged', money(m.logged), ['Expenses you logged']) +
      kpi('Not logged', money(m.unlogged), ['Spending you didn\'t log']) + '</div>';
    return h + privNote() + weekSummaryHtml(m, t) + linesHtml('expense', m) + catPickHtml() + moveModalHtml();
  }
  const last = latestActual(M, PERIOD);
  const nowVal = m.actual != null ? money(m.actual) : last ? `<span class="muted">${money(last.v)}</span>` : '—';
  const nowSub = m.actual != null ? `As of W${m.asOf.n} (${fmtDay(m.asOf.start)})` : last ? `Last known, ${periodLabel(last.k)}` : 'No balances entered yet';
  h += '<div class="kpis">' +
    kpi('Savings', nowVal, [nowSub, secTxt(m.actual != null ? m.actual : last && last.v)]) +
    (tw
      ? kpi(`Planned by W${tw.n} · ${fmtDay(tw.start)}`, money(tw.planned), [`End of ${mon(PERIOD)}: <b>${money(m.planned)}</b>`, m.asOf && m.asOf.planned ? `Actual is <b>${pct(m.actual / m.asOf.planned)}</b> of the W${m.asOf.n} plan` : '', secTxt(tw.planned)])
      : kpi('Planned end of ' + mon(PERIOD), money(m.planned), [m.accuracy != null ? `Actual is <b>${pct(m.accuracy)}</b> of plan` : `End of ${mon(prevK)} + planned income − planned expenses`, secTxt(m.planned)])) +
    kpi('Change since ' + mon(prevK), `<span class="${cls(m.change)}">${signed(m.change)}</span>`, [m.change == null ? `Needs balances in ${mon(prevK)} and ${mon(PERIOD)}` : '', secTxt(m.change)]) +
    kpi('Spent in ' + mon(PERIOD), money(m.spend), [m.spend == null ? 'Worked out from your balances once they are in' : `Logged ${money(m.logged)} · Not logged ${money(m.unlogged)}`, secTxt(m.spend)]) +
    '</div>';

  h += weekSummaryHtml(m, t);
  h += targetsHtml(m.actual != null ? m.actual : last && last.v);
  h += balancesHtml(m, t);
  h += linesHtml('income', m) + linesHtml('expense', m);
  return h + catPickHtml() + moveModalHtml();
}

/* Week by week: planned income and expenses landing in each week, the planned balance after it and the actual one. */
function weekSummaryHtml(m, t) {
  const weeks = m.weeks, wc = w => (w.start <= t && t <= w.end ? 'nowc' : '');
  const cells = (f, total, fmt) => weeks.map(w => `<td class="r ${wc(w)}">${fmt(f(w), w)}</td>`).join('') + `<td class="r tc">${total}</td>`;
  const mny = v => v ? money(v) : '<span class="muted">–</span>';
  let rows = '';
  if (!PRIV) rows += `<tr><td>Planned income</td>${cells(w => w.pInc, money(m.pInc), mny)}</tr>`;
  rows += `<tr><td>Planned expenses</td>${cells(w => w.pExp, money(m.pExp), mny)}</tr>`;
  if (!PRIV) {
    rows += `<tr class="hl"><td>Planned balance</td>${cells(w => w.planned, money(m.planned), v => money(v))}</tr>`;
    rows += `<tr><td>Actual balance</td>${cells(w => w.total, m.actual != null ? money(m.actual) : '—', v => v != null ? money(v) : '<span class="muted">—</span>')}</tr>`;
    rows += `<tr><td>Actual vs plan</td>${cells(w => w, m.accuracy != null ? pct(m.accuracy) : '—', (w) => w.total != null && w.planned ? `<span class="${cls(w.total - w.planned)}">${signed(w.total - w.planned)}</span><small>${pct(w.total / w.planned)}</small>` : '<span class="muted">—</span>')}</tr>`;
  }
  return `<div class="card"><h2>Week by week</h2><p class="hint">${PRIV ? 'Planned expenses per week.' : 'Planned money in and out per week, and where your balance should be vs where it is.'} Whole-month items sit in W1.</p>
    <div class="tw wkv"><table class="lines wk wsum"><thead><tr><th></th>${weeks.map(w => `<th class="r ${wc(w)}">W${w.n}<small>${fmtDay(w.start)}</small></th>`).join('')}<th class="r tc">${MON[+m.key.slice(5) - 1]}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

const privNote = () => `<div class="card"><div class="privnote"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  <span>Savings, balances, targets and income are hidden. Turn this off in Settings → Privacy.</span></div></div>`;

let PEDIT = false;
// First and last day of a month: a month's own start date has to fall inside its own month.
function monthBounds(k) { const [y, m] = k.split('-').map(Number); return [k + '-01', k + '-' + pad(new Date(y, m, 0).getDate())]; }
// The inline 'Start date' editor for the month being viewed.
function pstartHtml(k) {
  const [mn, mx] = monthBounds(k), custom = !!overrides()[k];
  return `<div class="card pstart"><div class="row" style="margin:0">
    <label class="f" style="flex-direction:row;align-items:center;gap:10px;font-size:calc(14px * var(--fs));color:var(--ink)">${periodLabel(k)} starts on
      <input type="date" data-act="pstart" data-k="${k}" data-fid="ps|${k}" min="${mn}" max="${mx}" value="${iso(periodStart(k))}"></label>
    ${custom ? `<button class="btn" data-act="pstartReset" data-k="${k}">Use pay day (${ord(payday())})</button>` : `<span class="hint" style="margin:0">Using pay day (${ord(payday())})</span>`}</div>
    <p class="hint" style="margin:10px 0 0">The period runs until the day before next month's start date (${fmtDay(addDays(periodStart(nextKey(k)), -1))} now). Pick any day in ${MONTHS[+k.slice(5) - 1]}.</p></div>`;
}
// Saves a month's own start date (blank = back to pay day). Refuses dates outside the month and any date that would
// leave a period shorter than 2 weeks, since a stray tap there would quietly reshuffle which weeks count in which month.
function setPeriodStart(k, dateStr) {
  const next = Object.assign({}, overrides());
  if (dateStr) {
    const [mn, mx] = monthBounds(k);
    if (dateStr < mn || dateStr > mx) { toast('Pick a day inside ' + periodLabel(k) + '.', true); return setTimeout(render, 0); }
    if (iso(defaultStart(k)) === dateStr) delete next[k]; else next[k] = dateStr;
  } else delete next[k];
  const s = periodStartWith(next, k), before = daysBetween(periodStartWith(next, nextKey(k, -1)), s), after = daysBetween(s, periodStartWith(next, nextKey(k)));
  if (before < 14 || after < 14) { toast(`That would make ${before < 14 ? periodLabel(nextKey(k, -1)) : periodLabel(k)} shorter than 2 weeks. Pick another day.`, true); return setTimeout(render, 0); }
  run(api('saveSettings', { periodStarts: JSON.stringify(next) }), 'Start date saved');
}

// Targets on the Month page: progress bar from the latest actual savings to each target, converted to USD at today's rate.
// The Budget page shows only the MAIN target (picked in Settings → Targets), so the page stays focused on one goal.
function targetsHtml(cur) {
  const main = mainTarget(); if (!main) return '';
  const more = D.targets.length > 1 ? `<span class="hint" style="margin:0;font-weight:400">Main target · <button class="tlink" data-act="jumpTargets">change</button></span>` : '';
  return `<div class="card"><h2 style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline">Target ${more}</h2><div class="targets">${[main].map(x => {
    const r = rateOf(x.currency), usd = r ? x.amount * r : null;
    const p = usd && cur != null ? cur / usd : null;
    const left = usd != null && cur != null ? usd - cur : null;
    return `<div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(x.name)}</b>
      <span class="muted">${money(x.amount, x.currency)}${x.currency !== 'USD' && usd ? ` ≈ ${money(usd)}` : ''}</span></div>
      <div class="bar"><i style="width:${Math.max(0, Math.min(100, (p || 0) * 100))}%"></i></div>
      <div class="hint" style="margin:0">${p == null ? 'No savings figure yet' : `${pct(p)} reached · ${left > 0 ? money(left) + ' to go' : 'Target reached'}`}${x.date ? ` · by ${fmtDate(x.date)}` : ''}${x.note ? ` · ${esc(x.note)}` : ''}</div></div>`;
  }).join('')}</div></div>`;
}

// What one account/week balance cell shows: the entered amount, or the carried-over one in grey, and the USD hint under it.
function cellInfo(a, w) {
  const e = IDX.byWeek[w.key] && IDX.byWeek[w.key][a.id];
  const carried = !e && a.active && IDX.byWeek[w.key] ? lastBefore(a.id, w.key) : null;
  const sub = e ? (e.currency !== a.currency ? 'in ' + e.currency : e.currency !== 'USD' ? money(usdOf(e.amount, e.rate, e.currency)) : '') : carried ? 'carried' : '';
  return { e, carried, sub };
}
// The input for one balance. Sums like 6250+8323 are allowed because that's how you add up sub-accounts.
const balInput = (a, w, c) => `<input class="num" inputmode="decimal" data-act="bal" data-ws="${w.key}" data-acc="${a.id}" data-fid="b|${w.key}|${a.id}"
  value="${c.e ? c.e.amount : ''}" placeholder="${c.carried ? c.carried.amount.toLocaleString('en-US') : ''}" title="${c.carried ? 'Carried over from ' + fmtDate(c.carried.weekStart) : ''}">`;
let BWEEK = {};

// Phone 'One week' view of balances: a week picker and one column, for when a full table is too cramped.
function balancesPhone(m, t, accs) {
  const weeks = m.weeks;
  const sel = weeks.find(w => w.key === BWEEK[PERIOD]) || weeks.find(w => w.start <= t && t <= w.end)
    || weeks.slice().reverse().find(w => w.total != null) || weeks[0];
  let h = `<div class="wk-pick">${weeks.map(w => `<button data-act="bweek" data-k="${w.key}" class="${w === sel ? 'on' : ''} ${IDX.byWeek[w.key] ? 'has' : ''}">W${w.n}<small>${fmtDay(w.start)}</small></button>`).join('')}</div>
    <div class="hint" style="margin-bottom:2px">${fmtDay(sel.start)} – ${fmtDay(sel.end)}${sel.start <= t && t <= sel.end ? ' · this week' : ''}</div><div class="alist">`;
  accs.forEach(a => {
    const c = cellInfo(a, sel);
    const sub = c.carried ? 'carried from ' + fmtDay(parseISO(c.carried.weekStart)) : c.sub;
    h += `<div class="ar"><div class="an">${esc(a.name)}<span class="cur">${esc(a.currency)}</span>${a.active ? '' : ' <span class="muted">(archived)</span>'}${sub ? `<small>${sub}</small>` : ''}</div>${balInput(a, sel, c)}</div>`;
  });
  return h + `<div class="ar tot"><span>Total (USD)</span><span style="text-align:right">${money(sel.total)}${sel.total != null && secTxt(sel.total) ? `<br><small class="muted" style="font-weight:400">${secTxt(sel.total)}</small>` : ''}</span></div></div>`;
}

/* Phone: balances as all weeks side by side (default) or one week at a time. Remembered on this device. */
let BVIEW = (() => { try { return localStorage.getItem('tracker-bview') || 'all'; } catch (e) { return 'all'; } })();
// Account balances, compact table: every week side by side. Phone defaults to all weeks too (it scrolls sideways,
// first column stays put), with 'One week' as the alternative.
function balancesHtml(m, t) {
  const weeks = m.weeks;
  const accs = D.accounts.filter(a => a.active || weeks.some(w => IDX.byWeek[w.key] && IDX.byWeek[w.key][a.id])).sort(byOrder);
  const one = PHONE && BVIEW === 'one';
  let h = `<div class="card"><div class="lhead"><h2>Account balances</h2>${PHONE ? `<div class="seg" role="group" aria-label="How to show balances">${[['all', 'All weeks'], ['one', 'One week']].map(([v, n]) => `<button data-act="bview" data-v="${v}" class="${(one ? 'one' : 'all') === v ? 'on' : ''}">${n}</button>`).join('')}</div>` : ''}</div>
    <p class="hint">${one
    ? 'Pick a week, then enter each balance in the account\'s currency. Skipped accounts carry over their last balance.'
    : 'Enter each account\'s balance in its own currency — sums like 6250+8323 work too. If you skip an account in a week, its last balance carries over (shown in grey).'}</p>`;
  if (!accs.length) return h + `<p class="hint">No accounts yet. Add them in Settings.</p></div>`;
  if (one) return h + balancesPhone(m, t, accs) + '</div>';
  const wc = w => (w.start <= t && t <= w.end ? 'nowc ' : '') + (w.start > t ? 'future' : '');
  h += `<div class="tw wkv"><table class="bal"><thead><tr><th>Account</th>${weeks.map(w => `<th class="r ${wc(w)}">W${w.n}<small>${fmtDay(w.start)} – ${fmtDay(w.end)}</small></th>`).join('')}</tr></thead><tbody>`;
  accs.forEach(a => {
    h += `<tr><td>${esc(a.name)} <span class="cur">${esc(a.currency)}</span>${a.active ? '' : ' <span class="muted">(archived)</span>'}</td>`;
    weeks.forEach(w => {
      const c = cellInfo(a, w);
      h += `<td class="r ${wc(w)}"><div class="cellv">${balInput(a, w, c)}<small>${c.sub}</small></div></td>`;
    });
    h += '</tr>';
  });
  h += `<tr class="total"><td>Total (USD)</td>${weeks.map(w => `<td class="r ${wc(w)}">${money(w.total)}${w.total != null && secTxt(w.total) ? `<small class="muted" style="font-weight:400;display:block">${secTxt(w.total)}</small>` : ''}</td>`).join('')}</tr>`;
  return h + '</tbody></table></div></div>';
}

// The 'When' choices for a line: whole month, every week, or a specific week (with its date, so W3 means something).
function whenOpts(sel, nWeeks, weeks) {
  const opts = [['', 'Whole month'], ['every', 'Every week']];
  for (let n = 1; n <= Math.max(nWeeks, /^[1-5]$/.test(sel) ? +sel : 0); n++) {
    const w = weeks && weeks[n - 1];
    opts.push([String(n), w ? `W${n} · ${fmtDay(w.start)}` : weeks ? `W${n} (last week)` : n === 5 ? 'Week 5 (or last)' : `Week ${n}`]);
  }
  return opts.map(([v, t]) => `<option value="${v}" ${String(sel || '') === v ? 'selected' : ''}>${t}</option>`).join('');
}
// The small ↻ tag on lines that come from a recurring group (tapping it opens the Recurring page).
function recTag(l) {
  const ri = recInfo(l); if (!ri) return '';
  const changed = !l.virtual;
  return `<span class="rtag" data-act="toRecurring" title="From the recurring group &quot;${esc(ri.group.name)}&quot;">↻ ${esc(ri.group.name)}${changed ? ' · changed this month' : ''}</span>${ri.item.note ? `<span class="rnote">${esc(ri.item.note)}</span>` : ''}`
    + (changed ? `<button class="linkbtn" data-act="resetLine" data-id="${l.id}" title="Use the recurring amount again">Undo change</button>` : '');
}

/* Income and Expenses on the Month page: lines grouped by category (closed until you tap one), shown either
   as the editable list ("All weeks") or as a read-only grid of where the money lands each week ("By week"). */
let CATOPEN = new Set();
const r2 = v => Math.round(v * 100) / 100;
let LVIEW = (() => { try { return JSON.parse(localStorage.getItem('tracker-lview') || '{}') || {}; } catch (e) { return {}; } })();
// Remembers All weeks / By week per section on this device.
function setLView(type, v) { LVIEW[type] = v; try { localStorage.setItem('tracker-lview', JSON.stringify(LVIEW)); } catch (e) {} render(); }
/** Where a line's planned amount lands, in USD: one value per week (or 'skip'), or the whole month. */
function catGroups(ls) {
  const by = {};
  ls.forEach(l => { (by[l.categoryId] = by[l.categoryId] || []).push(l); });
  const ord = id => (IDX.cat[id] ? IDX.cat[id].order : 999);
  return Object.keys(by).sort((a, b) => ord(a) - ord(b)).map(id => ({
    id, name: (IDX.cat[id] || {}).name || 'Other',
    lines: by[id].sort((a, b) => (recInfo(a) ? 0 : 1) - (recInfo(b) ? 0 : 1))
  }));
}
const chev = open => `<span class="chev">${open ? '▾' : '▸'}</span>`;

// Income or Expenses section. Two views:
// - By week (default): a grid in USD with a column per week, so you can see where money lands. You type planned amounts
//   straight into the week; the amount is converted back to the line's own currency before saving. Actual is one narrow
//   column for the month (it stays faint until filled) because actuals matter less than the plan here.
// - All weeks: the original editable list with currency, planned and actual per line.
// Categories start closed so a long month stays short; the subtotal row still shows each category's numbers.
function linesHtml(type, m) {
  const isInc = type === 'income', weeks = m.weeks, nW = weeks.length, view = LVIEW[type] === 'all' ? 'all' : 'week'; // By week unless you pick All weeks
  const ls = linesFor(PERIOD).filter(l => catType(l) === type), groups = catGroups(ls);
  const pUsd = l => l.planned != null ? usdOf(l.planned, l.rate, l.currency) * weekMult(l, nW) : 0;
  const aUsd = l => l.actual != null ? usdOf(l.actual, l.rate, l.currency) : 0;
  const sum = (arr, f) => arr.reduce((t, l) => t + f(l), 0);
  const key = g => type + '|' + g.id, isOpen = g => CATOPEN.has(key(g));
  let h = `<div class="card"><div class="lhead"><h2>${isInc ? 'Income' : 'Expenses'}</h2>
    <div class="lctl">${view === 'week' ? `<label class="ovsel wcur"><span>Show in</span><select data-act="wcur" aria-label="Show amounts in">${currencies().map(c => `<option ${c === wcur() ? 'selected' : ''}>${c}</option>`).join('')}</select></label>` : ''}
    <div class="seg" role="group" aria-label="How to show ${isInc ? 'income' : 'expenses'}">${[['all', 'All weeks'], ['week', 'By week']].map(([v, n]) => `<button data-act="lview" data-type="${type}" data-v="${v}" class="${view === v ? 'on' : ''}">${n}</button>`).join('')}</div></div></div>
    <p class="hint">${view === 'week'
      ? `Shown in ${wcur()}; each line still saves in its own currency. Type into a week, or add a code like "500 EGP". ⇄ moves an item to another week or month. ↻ items come from Recurring — edits here change this month only.`
      : `${isInc ? 'Planned income feeds the planned balance. Fill in Actual once it lands; until then the planned amount is used.' : 'Plan the expenses you expect. Log actual amounts only for the ones worth tracking — total spending is still worked out from your balances.'} Tap a category to open it. Items marked ↻ come from the Recurring tab; changing them here changes this month only. With "Every week", Planned is per week and Actual is the month's total.`}</p>`;
  const totP = isInc ? m.pInc : m.pExp, totA = isInc ? m.aInc : m.aExp;
  if (!ls.length) h += `<p class="hint">Nothing added for this period yet.</p>`;
  else if (view === 'week') {
    // ---- By week: one column per week; type planned amounts straight into the week ----
    // Shown in one currency you choose (USD by default). A line in that same currency shows its exact amount; others are
    // converted (USD via the line's saved rate, then to the chosen currency at today's rate). What you type is converted
    // back into the line's own currency before saving, so lines never silently change currency.
    const dc = wcur(), toD = v => v == null || typeof v !== 'number' ? v : dc === 'USD' ? v : v / rateOf(dc), money = (v, c) => moneyBase(v, c || dc);
    const lw = new Map(ls.map(l => [l, lineWeeks(l, weeks)]));
    const hasMonth = ls.some(l => !l.week);
    const t = today(), wc = w => (w.start <= t && t <= w.end ? 'nowc' : '');
    const cell = v => v === 'skip' ? '<span class="muted" title="Skipped this week">–</span>' : v == null ? '' : money(v);
    const colSum = (arr, i) => { let v = 0, any = false; arr.forEach(l => { const x = i === 'm' ? lw.get(l).month : lw.get(l).per[i]; if (typeof x === 'number') { v += x; any = true; } }); return any ? v : null; };
    const colSumD = (arr, i) => toD(colSum(arr, i));
    const sumRow = (cls, attrs, label, arr, totOverride) => `<tr class="${cls}" ${attrs}><td>${label}</td>${hasMonth ? `<td class="r">${cell(colSumD(arr, 'm'))}</td>` : ''}${weeks.map((w, i) => `<td class="r ${wc(w)}">${cell(colSumD(arr, i))}</td>`).join('')}<td class="r"><b>${money(toD(totOverride != null ? totOverride : sum(arr, pUsd)))}</b></td><td class="r">${arr.some(l => l.actual != null) ? money(toD(sum(arr, aUsd))) : ''}</td></tr>`;
    const inD = (amt, l) => amt == null ? '' : l.currency === dc ? amt : r2(toD(usdOf(amt, l.rate, l.currency)));
    const perUsd = l => inD(l.planned, l);
    const inp = (l, f, col, v, cls2, ph) => `<input class="num ${cls2}" inputmode="decimal" data-act="lusd" data-cur="${dc}" data-id="${l.id}" data-field="${f}" data-fid="l|${l.id}|u${f}${col}" value="${v}" placeholder="${ph || ''}" title="In ${dc}${l.currency !== dc ? ' (saved in ' + l.currency + ')' : ''}. You can also type e.g. 500 EGP.">`;
    h += `<div class="tw wkv"><table class="lines wk wke"><thead><tr><th>${isInc ? 'Income' : 'Expense'}</th>${hasMonth ? '<th class="r" title="Whole-month items (no set week)">Month</th>' : ''}${weeks.map(w => `<th class="r ${wc(w)}">W${w.n}<small>${fmtDay(w.start)}</small></th>`).join('')}<th class="r">Planned</th><th class="r act">Actual</th></tr></thead><tbody>`;
    groups.forEach(g => {
      const open = isOpen(g);
      h += sumRow('cathead' + (open ? ' open' : ''), `data-act="catTog" data-c="${key(g)}"`, `${chev(open)}<b>${esc(g.name)}</b> <span class="muted">· ${g.lines.length}</span>`, g.lines);
      if (open) g.lines.forEach(l => {
        const x = lw.get(l), ri = recInfo(l), f = fld => `data-act="line" data-id="${l.id}" data-field="${fld}" data-fid="l|${l.id}|${fld}"`;
        const own = i => l.week === 'every' ? (!l.only || l.only.includes(weeks[i].key)) : /^[1-5]$/.test(l.week) && Math.min(+l.week, nW) - 1 === i;
        h += `<tr class="sub${ri ? ' recrow' : ''}"><td><div class="wki">
            <div class="wkt"><input class="note sm" ${f('note')} value="${esc(l.note)}" placeholder="${esc(g.name)}"><button class="del" data-act="delLine" data-id="${l.id}" title="${l.recurId ? 'Remove from this month' : 'Delete line'}">×</button></div>
            <div class="wkm"><select class="sm" ${f('week')} title="When">${whenOpts(l.week, nW, weeks)}</select><select class="sm cursel" ${f('currency')} title="The currency this line is saved in">${curOpts(l.currency)}</select><button class="mv" data-act="lMove" data-id="${l.id}" title="Move to another week or month">⇄</button>${ri ? `<span class="rtag" data-act="toRecurring" title="From &quot;${esc(ri.group.name)}&quot;${ri.item.note ? ' — ' + esc(ri.item.note) : ''}">↻ ${esc(ri.group.name)}</span>` : ''}</div></div></td>
          ${hasMonth ? `<td class="r">${!l.week ? inp(l, 'planned', 'm', perUsd(l), 'wkin') : ''}</td>` : ''}
          ${x.per.map((v, i) => `<td class="r ${wc(weeks[i])}">${own(i) ? inp(l, 'planned', i, perUsd(l), 'wkin') : v === 'skip' ? cell(v) : ''}</td>`).join('')}
          <td class="r muted">${l.planned != null ? money(pUsd(l)) : ''}</td>
          <td class="r act">${inp(l, 'actual', 'a', inD(l.actual, l), 'wkact' + (l.actual != null ? ' has' : ''), '–')}</td></tr>`;
      });
    });
    h += sumRow('total', '', `Total (${dc})`, ls, totP) + '</tbody></table></div>';
  } else if (PHONE) {
    // ---- All weeks, phone: a card per line under each category ----
    const perWeek = l => l.week === 'every' && l.planned != null ? `<small class="pw">× ${weekMult(l, nW)} wk = ${money(pUsd(l))}</small>` : '';
    h += groups.map(g => {
      const open = isOpen(g), hasA = g.lines.some(l => l.actual != null);
      let c = `<div class="catgrp${open ? ' open' : ''}"><button class="cathead" data-act="catTog" data-c="${key(g)}">${chev(open)}<b>${esc(g.name)}</b><small>${g.lines.length} item${g.lines.length > 1 ? 's' : ''}</small><span class="ct">${money(sum(g.lines, pUsd))}${hasA ? `<small>${money(sum(g.lines, aUsd))} actual</small>` : ''}</span></button>`;
      if (open) c += '<div class="lcards">' + g.lines.map(l => {
        const f = fld => `data-act="line" data-id="${l.id}" data-field="${fld}" data-fid="l|${l.id}|${fld}"`;
        const tag = recTag(l);
        return `<div class="lc">${tag ? `<div class="full rrow">${tag}</div>` : ''}<div class="full"><select ${f('categoryId')}>${catOpts(type, l.categoryId)}</select><button class="mv" data-act="lMove" data-id="${l.id}" title="Move to another week or month">⇄</button><button class="del" data-act="delLine" data-id="${l.id}" title="${l.recurId ? 'Remove from this month' : 'Delete line'}">×</button></div>
          <div class="full"><input class="note" style="width:100%" ${f('note')} value="${esc(l.note)}" placeholder="Add a note"></div>
          <label class="span2">When<select ${f('week')}>${whenOpts(l.week, nW, weeks)}</select></label>
          <label>Currency<select ${f('currency')}>${curOpts(l.currency)}</select></label>
          <label class="span2">${l.week === 'every' ? 'Planned per week' : 'Planned'}<input class="num" inputmode="decimal" ${f('planned')} value="${l.planned != null ? l.planned : ''}">${perWeek(l)}</label>
          <label>Actual<input class="num" inputmode="decimal" ${f('actual')} value="${l.actual != null ? l.actual : ''}"></label>
          ${l.currency === 'USD' && l.week !== 'every' ? '' : `<div class="usd">In USD: ${l.planned != null ? money(pUsd(l)) : '—'} planned · ${l.actual != null ? money(aUsd(l)) : '—'} actual</div>`}</div>`;
      }).join('') + '</div>';
      return c + '</div>';
    }).join('') + `<div class="ltot"><span>Total (USD)</span><span>${money(totP)} planned · ${money(totA)} actual</span></div>`;
  } else {
    // ---- All weeks, computer: one table, a row per category that opens to its lines ----
    const perWeek = l => l.week === 'every' && l.planned != null ? `<small class="pw">× ${weekMult(l, nW)} wk = ${money(pUsd(l))}</small>` : '';
    h += `<div class="tw"><table class="lines"><thead><tr><th>Category</th><th style="width:100%">Note</th><th>When</th><th>Currency</th><th class="r">Planned</th><th class="r">Actual</th><th class="r">In USD</th><th></th></tr></thead><tbody>`;
    groups.forEach(g => {
      const open = isOpen(g), hasA = g.lines.some(l => l.actual != null);
      h += `<tr class="cathead${open ? ' open' : ''}" data-act="catTog" data-c="${key(g)}"><td colspan="4">${chev(open)}<b>${esc(g.name)}</b> <span class="muted">· ${g.lines.length} item${g.lines.length > 1 ? 's' : ''}</span></td><td class="r"><b>${money(sum(g.lines, pUsd))}</b></td><td class="r">${hasA ? money(sum(g.lines, aUsd)) : '—'}</td><td colspan="2"></td></tr>`;
      if (open) g.lines.forEach(l => {
        const f = fld => `data-act="line" data-id="${l.id}" data-field="${fld}" data-fid="l|${l.id}|${fld}"`;
        const tag = recTag(l);
        h += `<tr class="sub${l.recurId ? ' recrow' : ''}"><td><select ${f('categoryId')}>${catOpts(type, l.categoryId)}</select></td>
          <td><input class="note" ${f('note')} value="${esc(l.note)}" placeholder="Add a note">${tag ? `<div class="rrow">${tag}</div>` : ''}</td>
          <td><select ${f('week')}>${whenOpts(l.week, nW, weeks)}</select></td>
          <td><select ${f('currency')}>${curOpts(l.currency)}</select></td>
          <td class="r"><div class="cellv"><input class="num" inputmode="decimal" ${f('planned')} value="${l.planned != null ? l.planned : ''}" title="${l.week === 'every' ? 'Per week' : ''}">${perWeek(l)}</div></td>
          <td class="r"><input class="num" inputmode="decimal" ${f('actual')} value="${l.actual != null ? l.actual : ''}"></td>
          <td class="r muted">${l.currency === 'USD' && l.week !== 'every' ? '' : `${l.planned != null ? money(pUsd(l)) : '—'} / ${l.actual != null ? money(aUsd(l)) : '—'}`}</td>
          <td class="nowrap"><button class="mv" data-act="lMove" data-id="${l.id}" title="Move to another week or month">⇄</button><button class="del" data-act="delLine" data-id="${l.id}" title="${l.recurId ? 'Remove from this month' : 'Delete line'}">×</button></td></tr>`;
      });
    });
    h += `<tr class="total"><td colspan="4">Total (USD)</td><td class="r">${money(totP)}</td><td class="r">${money(totA)}</td><td colspan="2"></td></tr></tbody></table></div>`;
  }
  h += `<div class="row"><button class="btn" data-act="addLine" data-type="${type}">+ Add ${isInc ? 'income' : 'expense'}</button><button class="btn" data-act="toRecurring">↻ Recurring ${isInc ? 'income' : 'expenses'}</button></div>`;
  if (!isInc && m.spend != null) h += `<div class="sum"><span>Spent (from balances) <b>${money(m.spend)}</b></span><span>Logged <b>${money(m.logged)}</b></span><span>Not logged <b>${money(m.unlogged)}</b></span></div>`;
  return h + '</div>';
}

/* ---------- Overview ---------- */
/* Targets.
   - The MAIN target (Settings → Targets → Main) is the one on the Budget page and the Overview's default.
     If none is set, or it was deleted, the first target is the main one.
   - The Overview can show the main target, any one target, all of them, or none (top-bar picker, not saved).
   Each target is used in USD (converted at today's rate) with the period its date falls in. */
const TG_COLORS = ['#121117', '#e8590c', '#0c8599', '#c2255c', '#2f9e44', '#5f3dc4']; // first one turns light in night mode
function mainTarget() { return D.targets.find(t => t.id === S_().mainTarget) || D.targets[0] || null; }
const S_ = () => D.settings || {};
const tInfo = tg => ({ tg, usd: rateOf(tg.currency) ? tg.amount * rateOf(tg.currency) : null, k: tg.date ? periodOf(parseISO(tg.date)) : null });
function shownTargets() {
  const main = mainTarget(); if (!main) return [];
  const pick = OVIEW.tg || 'main';
  let list = pick === 'none' ? [] : pick === 'all' ? [main].concat(D.targets.filter(t => t !== main)) : pick === 'main' ? [main] : D.targets.filter(t => t.id === pick);
  if (!list.length && pick !== 'none') list = [main]; // the picked target was deleted
  const others = D.targets.filter(t => t !== main); // each target keeps the same colour whichever view is picked
  return list.map(tg => Object.assign(tInfo(tg), { color: tg === main ? TG_COLORS[0] : TG_COLORS[1 + others.indexOf(tg) % (TG_COLORS.length - 1)] }));
}
/* The first shown target (main by default): used for the "To …" column and the privacy scale. */
function targetInfo() { return shownTargets()[0] || null; }
/* The Overview runs to the target's month (or 6 months ahead if it has no date), so planned months can be checked against it. */
function overviewEnd() {
  let k = lastKey(); const cur = periodOf(today()), cap = nextKey(cur, 36);
  shownTargets().forEach(t => { const want = t.k || nextKey(cur, 6), end = want > cap ? cap : want; if (end > k) k = end; }); // reach the latest shown target
  return k;
}
/* How far a period's savings (actual, or planned if not known yet) are from the target. */
function toTarget(m, t) {
  if (!t || t.usd == null) return null;
  const base = m.actual != null ? m.actual : m.planned;
  return base == null ? null : { left: t.usd - base, planned: m.actual == null };
}
function toTargetHtml(g) {
  if (!g) return '—';
  if (g.left <= 0) return `<span class="pos">Reached</span>`;
  return g.planned ? `<span class="muted">${money(g.left)}</span>` : money(g.left);
}
const targetTag = (k, t) => t && t.k === k ? '<span class="nowtag tgtag">TARGET</span>' : '';

/* Overview list: a small year / quarter label where a new quarter starts (newest first). */
const quarterOf = k => Math.ceil(+k.slice(5) / 3);
// Small 'year / Q' labels in the Overview list, only where a new quarter starts. Kept understated on purpose.
function qHead(k, prev, cols) {
  if (prev && prev.slice(0, 4) === k.slice(0, 4) && quarterOf(prev) === quarterOf(k)) return '';
  const inner = `${!prev || prev.slice(0, 4) !== k.slice(0, 4) ? `<b>${k.slice(0, 4)}</b>` : ''}<span>Q${quarterOf(k)}</span>`;
  return cols ? `<tr class="qhd"><td colspan="${cols}">${inner}</td></tr>` : `<div class="qhd">${inner}</div>`;
}

/* Overview filters: Monthly / Weekly and a From–To range. Kept in memory, so every visit starts on Monthly, all periods. */
const OVIEW = { mode: 'month', from: '', to: '', tg: 'main' };
// Periods inside the From/To range.
function ovKeys(M) {
  let keys = Object.keys(M).filter(k => k >= firstKey()).sort();
  if (OVIEW.from) keys = keys.filter(k => k >= OVIEW.from);
  if (OVIEW.to) keys = keys.filter(k => k <= OVIEW.to);
  return keys;
}
// Overview controls in the top bar: Monthly/Weekly and a From/To range (shorter labels on phone so they fit one row).
function ovToolHtml() {
  const M = metrics(overviewEnd()), all = Object.keys(M).filter(k => k >= firstKey()).sort();
  const opt = (sel, first) => `<option value="">${first}</option>` + all.map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${MON[+k.slice(5) - 1]} ${k.slice(0, 4)}</option>`).join('');
  return `<div class="ovtool"><div class="seg" role="group" aria-label="Monthly or weekly">${[['month', PHONE ? 'Month' : 'Monthly'], ['week', PHONE ? 'Week' : 'Weekly']].map(([v, n]) => `<button data-act="ovMode" data-v="${v}" class="${OVIEW.mode === v ? 'on' : ''}">${n}</button>`).join('')}</div>
    <label class="ovsel"><span>From</span><select data-act="ovFrom" aria-label="From">${opt(OVIEW.from, PHONE ? 'From…' : 'Start')}</select></label>
    <label class="ovsel"><span>To</span><select data-act="ovTo" aria-label="To">${opt(OVIEW.to, PHONE ? 'To…' : 'End')}</select></label>
    ${OVIEW.from || OVIEW.to ? `<button class="btn" data-act="ovAll" title="Show all periods">All</button>` : ''}
    ${PHONE ? '' : tgPickHtml()}</div>`;
}
// Which target(s) the chart shows. In the top bar on desktop; on a phone it sits above the chart (the top bar is full there).
function tgPickHtml() {
  if (D.targets.length < 2) return '';
  const main = mainTarget();
  return `<label class="ovsel tgpick"><span>Target</span><select data-act="ovTg" aria-label="Target on the chart">`
    + `<option value="main" ${OVIEW.tg === 'main' ? 'selected' : ''}>${esc(main.name)} (main)</option>`
    + D.targets.filter(t => t !== main).map(t => `<option value="${t.id}" ${OVIEW.tg === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')
    + `<option value="all" ${OVIEW.tg === 'all' ? 'selected' : ''}>All targets</option><option value="none" ${OVIEW.tg === 'none' ? 'selected' : ''}>No target</option></select></label>`;
}
/* One point per week across the chosen months, shaped like a month so the chart and read-out can use it. */
function weekSeries(keys, M) {
  const out = {}, wkeys = [], curW = iso(weekStartOf(today()));
  let prevA = null;
  keys.forEach(k => M[k].weeks.forEach((w, i, arr) => {
    const id = w.key;
    const actual = w.total != null ? w.total : null;
    out[id] = { k, n: w.n, of: arr.length, actual, planned: w.planned, pInc: w.pInc, pExp: w.pExp,
      accuracy: actual != null && w.planned ? actual / w.planned : null,
      change: actual != null && prevA != null ? actual - prevA : null, now: id === curW,
      label: `W${w.n} · ${periodLabel(k)}`, range: `${fmtDay(w.start)} – ${fmtDay(addDays(w.start, 6))}` };
    if (actual != null) prevA = actual;
    wkeys.push(id);
  }));
  return { keys: wkeys, M: out, cur: wkeys.find(x => out[x].now) || null };
}

// Overview: savings chart (actual vs planned, plus the target line) and the list of periods or weeks.
function renderOverview() {
  const Mall = metrics(overviewEnd()), t = targetInfo();
  const keys = ovKeys(Mall);
  const c = sec(), showSec = c && c !== 'USD';
  const curK = periodOf(today());
  const weekly = OVIEW.mode === 'week';
  if (!keys.length) return `<div class="card"><p class="hint">No periods in that range.</p></div>`;
  const S = weekly ? weekSeries(keys, Mall) : null;
  // each shown target, with the chart point it's due on (its month, or the last week of that month)
  const tgs = shownTargets().map(x => Object.assign({}, x, { key: x.k ? (weekly ? (S.keys.find(w => S.M[w].k === x.k && S.M[w].n === S.M[w].of) || null) : x.k) : null }));
  if (PRIV) return privOverview(keys, Mall, c, showSec, curK, S, tgs);
  const unit = weekly ? 'week' : 'month';
  const tgHint = tgs.length === 1 && t.usd != null ? ` The dotted line is ${esc(t.tg.name)}${t.k ? `, due ${periodLabel(t.k)}` : ''}; ${unit}s ahead show your plan.` : tgs.length > 1 ? ` Dotted lines are your targets; ${unit}s ahead show your plan.` : '';
  let h = `<div class="card"><h2>Savings over time${weekly ? ' · by week' : ''}</h2><p class="hint" style="margin:0 0 8px">${PHONE ? 'Tap or slide along the chart' : 'Hover over the chart'} to see each ${unit}'s numbers.${tgHint}</p>
    ${PHONE && D.targets.length > 1 ? `<div class="tgrow">${tgPickHtml()}</div>` : ''}${chartLegend(tgs)}
    ${weekly ? chartSvg(S.keys, S.M, { week: true, curKey: S.cur, targets: tgs }) : chartSvg(keys, Mall, { targets: tgs })}</div>`;
  if (weekly) return h + weekListHtml(S, t, c, showSec);
  const M = Mall;
  if (PHONE) {
    return h + `<div class="card"><h2>By period</h2><p class="hint">Tap a period to open it.</p><div class="pcards">${keys.slice().reverse().map((k, i, arr) => {
      const m = M[k];
      const g = toTarget(m, t);
      return qHead(k, arr[i - 1]) + `<div class="pc${k === curK ? ' now' : ''}" data-act="goto" data-k="${k}"><div><b>${periodLabel(k)}</b>${k === curK ? '<span class="nowtag">NOW</span>' : ''}${targetTag(k, t)}<br><small class="muted">${periodRange(k)}</small></div>
        <div class="pv">${m.actual != null ? money(m.actual) : `<span class="muted" style="font-size:calc(13px * var(--fs));font-weight:500">Plan ${money(m.planned)}</span>`}</div>
        <div class="pm">${m.actual != null ? `<span>Plan <b>${money(m.planned)}</b></span><span>Accuracy <b>${pct(m.accuracy)}</b></span>` : ''}${m.change != null ? `<span>Change <b class="${cls(m.change)}">${signed(m.change)}</b></span>` : ''}${m.spend != null ? `<span>Spent <b>${money(m.spend)}</b></span>` : ''}<span>Income <b>${money(m.incUsed)}</b></span>${showSec && m.actual != null ? `<span>${c} <b>${money(inSec(m.actual), c)}</b></span>` : ''}${g ? `<span>To ${esc(t.tg.name)} <b>${toTargetHtml(g)}</b></span>` : ''}</div></div>`;
    }).join('')}</div></div>`;
  }
  h += `<div class="card"><h2>By period</h2><p class="hint">Click a row to open that period.</p><div class="tw"><table><thead><tr>
    <th>Period</th><th class="r">Planned</th><th class="r">Actual</th><th class="r">Accuracy</th><th class="r">Change</th><th class="r">Income</th><th class="r">Spent</th><th class="r">Logged</th>
    ${showSec ? `<th class="r">Spent (${c})</th><th class="r">Savings (${c})</th>` : ''}${t && t.usd != null ? `<th class="r" title="How far savings are from ${esc(t.tg.name)} — grey when it's worked out from the plan">To ${esc(t.tg.name)}</th>` : ''}</tr></thead><tbody>`;
  keys.slice().reverse().forEach((k, i, arr) => {
    const m = M[k];

// Legend under the chart title: actual, planned and one dotted line per shown target (in its colour).
const chartLegend = tgs => `<div class="legend"><span><i style="border-color:#7c3aed"></i>Actual</span><span><i style="border-color:#9a9aa6;border-top-style:dashed"></i>Planned</span>${tgs.map(x => `<span><i style="border-color:${x.color};border-top-style:dotted"></i>${esc(x.tg.name)}</span>`).join('')}</div>`;

// Draws the chart as plain SVG (no chart library, so nothing extra to load inside Apps Script).
// opt picks which fields to draw, the mode (savings / spend / pct), weekly labels, and which point is 'now' and 'target'.
function chartSvg(keys, M, opt) {
  // opt: which numbers to draw. Default = savings (Actual vs Planned, plus the first target).
  opt = Object.assign({ main: 'actual', plan: 'planned', target: true, mode: 'savings', label: 'Planned and actual savings by period' }, opt || {});
  CH = null;
  const W = PHONE ? 400 : 960, H = PHONE ? 250 : 280, L = PHONE ? 50 : 70, R = PHONE ? 18 : 36, T = 16, B = 34, FS = PHONE ? 11 : 14;
  const yLab = v => opt.priv ? (tgUsd ? Math.round(v / tgUsd * 100) + '%' : '') : opt.mode === 'pct' ? Math.round(v) + '%' : PHONE ? (Math.abs(v) < 50 ? '$0' : (v < 0 ? '-' : '') + '$' + (Math.abs(v) / 1000).toFixed(1) + 'k') : money(v);

  const vals = [];
  keys.forEach(k => [opt.plan, opt.main].forEach(f => { if (M[k][f] != null) vals.push(M[k][f]); }));
  if (opt.mode === 'spend') vals.push(0); // spending charts start from zero
  tgs.forEach(x => vals.push(x.usd));

  let lo = Math.min(...vals), hi = Math.max(...vals);
  const sp = (hi - lo) || Math.abs(hi) || 1; lo -= sp * 0.08; hi += sp * 0.08;
  if (opt.mode === 'spend' && Math.min(...vals) >= 0) lo = 0; // spending never goes below zero
  const x = i => keys.length < 2 ? (L + W - R) / 2 : L + i * (W - L - R) / (keys.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);

  const path = f => { let d = '', pen = false; keys.forEach((k, i) => { const v = M[k][f]; if (v == null) return; d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; }); return d; };

  // hover read-out pieces (hidden until used)

    <circle class="cp" r="5" fill="#fff" stroke="#9a9aa6" stroke-width="2" visibility="hidden"/>
    <circle class="ca" r="6" fill="#7c3aed" stroke="#fff" stroke-width="2" visibility="hidden"/>`;
  CH = { mode: opt.mode, priv: !!opt.priv, week: !!opt.week, keys, M, W, tgs: tgs.map(t => ({ name: t.tg.name, usd: t.usd, k: t.key })), tg: tgs.length ? { name: tgs[0].tg.name, usd: tgs[0].usd, k: tgs[0].key } : null, xs: keys.map((k, i) => x(i)), ya: keys.map(k => M[k][opt.main] != null ? y(M[k][opt.main]) : null), yp: keys.map(k => M[k][opt.plan] != null ? y(M[k][opt.plan]) : null) };
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${opt.label}">${g}</svg><div class="ctip" hidden></div></div>`;

// The hover/tap read-out. Finds the nearest point to the pointer, then lists its numbers with EGP next to the planned,
// target and to-go amounts. Kept inside the card on narrow screens.
function chartTip(e) {
  const wrap = e.target.closest && e.target.closest('.chartwrap'); if (!wrap || !CH) return;
  const svg = wrap.querySelector('svg'), r = svg.getBoundingClientRect();
  const vx = (e.clientX - r.left) / r.width * CH.W;
  let i = 0, best = Infinity;
  CH.xs.forEach((x, j) => { const d = Math.abs(x - vx); if (d < best) { best = d; i = j; } });
  const k = CH.keys[i], m = CH.M[k], set = (sel, attrs) => { const n = svg.querySelector(sel); Object.keys(attrs).forEach(a => n.setAttribute(a, attrs[a])); };

  const spendMode = CH.mode === 'spend';
  set('.ca', CH.ya[i] != null ? { cx: CH.xs[i], cy: CH.ya[i], visibility: 'visible' } : { visibility: 'hidden' });
  set('.cp', CH.yp[i] != null ? { cx: CH.xs[i], cy: CH.yp[i], visibility: 'visible' } : { visibility: 'hidden' });

  const both = v => v == null ? '—' : money(v) + (hasSec ? ` <span class="k">· ${money(inSec(v), c)}</span>` : '');

  const head = `<b>${CH.week ? m.label : periodLabel(k)}</b>${isNow ? ' <span class="nowtag">NOW</span>' : ''}<div class="k" style="font-size:calc(11px * var(--fs))">${CH.week ? m.range : periodRange(k)}</div>`;
  const weekPlan = CH.week ? `<div class="tsep2"></div>` + row(isNow ? 'Planned this week' : 'Planned that week', '') + row('&nbsp; In', m.pInc ? '+' + money(m.pInc) : '—') + row('&nbsp; Out', m.pExp ? '−' + money(m.pExp) : '—') : '';

    + row('Savings vs plan', m.accuracy != null ? `<b>${pct(m.accuracy)}</b>` : '<span class="k">not known yet</span>')
    + (CH.week ? row('Planned out', money(m.pExp)) : row('Planned expenses', money(m.pExp)) + (m.spend != null ? row('Spent', money(m.spend)) : ''));

    + (m.spend != null ? row('Spent', `<b>${money(m.spend)}</b>${hasSec ? ` <span class="k">· ${money(inSec(m.spend), c)}</span>` : ''}`) : row('Spent', '<span class="k">not known yet</span>'))

      + (m.change != null && prevA ? row('Change', `<span class="${cls(m.change)}">${m.change >= 0 ? '+' : '−'}${pct(Math.abs(m.change / prevA))}</span>`) : '')
      + (CH.week ? `<div class="tsep2"></div>` + row(isNow ? 'Planned out this week' : 'Planned out that week', m.pExp ? money(m.pExp) : '—') : (m.spend != null ? row('Spent', money(m.spend)) : ''))
      + (base != null ? CH.tgs.map(tg => `<div class="tsep2"></div>` + row(esc(tg.name) + (tg.k === k ? ' <span class="nowtag tgtag">DUE</span>' : ''), '')

    + row(CH.week ? 'Planned balance' : 'Planned', both(m.planned))
    + (m.accuracy != null ? row('Accuracy', pct(m.accuracy)) : '')
    + (m.change != null ? row('Change', `<span class="${cls(m.change)}">${signed(m.change)}</span>`) : '')

/* ---------- Recurring ---------- */
function monthOpts(sel, emptyLabel, min) {
  const cur = periodOf(today());
  let a = firstKey(); if (a > cur) a = cur;
  if (sel && sel < a) a = sel;
  const last = sel && sel > nextKey(cur, 24) ? sel : nextKey(cur, 24), out = [`<option value="">${emptyLabel}</option>`];
  for (let k = a; k <= last; k = nextKey(k)) {
    if (min && k < min && k !== sel) continue;
    out.push(`<option value="${k}" ${k === sel ? 'selected' : ''}>${periodLabel(k)}</option>`);
  }
  return out.join('');
}
// Recurring groups repeat monthly (default), weekly or yearly. Yearly groups land in the month their start month names.
const FREQ_TXT = { monthly: 'Every month', weekly: 'Every week', yearly: 'Every year' };
// The status line on a group card: not started, running, ended, or starting later.
function groupStatus(g) {
  const cur = periodOf(today()), f = gFreq(g), when = f === 'yearly' && g.start ? 'Every ' + MONTHS[+g.start.slice(5) - 1] : FREQ_TXT[f];
  if (!g.start) return ['Not added to any month yet', 'off'];
  if (g.end && g.end < cur) return ['Ended ' + periodLabel(g.end), 'off'];
  if (g.start > cur) return [when + ' · starts ' + periodLabel(g.start), 'soon'];
  return [when + (g.end ? ' · until ' + periodLabel(g.end) : ''), 'on'];
}
const AVG_WEEKS = 52 / 12; // "every week" items average about 4.33 weeks a month
/** What a group adds up to, in USD: per week for weekly groups, per year for yearly ones, otherwise per month. Items switched off don't count. */
function groupTotal(g) {
  const f = gFreq(g); let t = 0, approx = false;
  D.recItems.filter(i => i.groupId === g.id && i.active !== false).forEach(i => {
    if (i.amount == null) return;
    const usd = usdOf(i.amount, i.rate, i.currency);
    if (f !== 'weekly' && i.week === 'every') { t += usd * AVG_WEEKS; approx = true; } else t += usd; // "every week" items in a month (or the one month a year)
  });
  return { t, approx, per: f === 'weekly' ? 'a week' : f === 'yearly' ? 'a year' : 'a month' };
}
// Category for a new recurring item: one named like the group if there is one, else the first category of that type.
function defaultCat(type, groupName) {
  const cs = D.categories.filter(c => c.type === type && c.active).sort(byOrder);
  return (cs.find(c => c.name.toLowerCase() === String(groupName || '').toLowerCase()) || cs[0] || {}).id;
}

// Recurring page: income groups, then expense groups. Each group is a card with its items.
function renderRecurring() {

  const howTo = `<div class="card howto"><h2>How Recurring works</h2><p class="hint">Put things that repeat into groups — like Salary, or Subscriptions with Netflix and Spotify inside. A group repeats every month, every week or once a year, from the month you pick, and you can leave out single months or weeks with <b>Skip</b>. Every item counts in the month summary and Overview unless you switch it off. Change or remove an item in one month on the Budget page; that affects only that month.</p>
    <p class="hint" style="margin:0">Editing an item here changes every month the group covers (except months you changed by hand). To change things from a certain month on, <b>Duplicate</b> the group, edit the copy and pick its start month, then set <b>Until</b> on the old one.</p></div>`;
  let h = '';

// On/off switch. An item switched off stays in the list but counts nowhere, so you can keep it without deleting it.

/* ---------- Skip: leave single months (or weeks, for weekly groups) out of a group ---------- */
let SKIPG = null;
// Skip box: tap months (or weeks, for weekly groups) to leave them out of a group without ending it.
function skipModalHtml() {

    <h2 id="skTitle">Skip</h2><p class="hint" id="skHint"></p><div id="skList"></div>
    <div class="row nbtns"><button class="btn" data-act="skClear">Skip none</button><span style="flex:1"></span><button class="btn primary" data-act="skDone">Done</button></div></div></div>`;
}
/** The months (or weeks) shown in the Skip box: a year back to two years ahead, inside the group's range. */
function skipChoices(g) {

  const lo = nextKey(cur, f === 'weekly' ? -3 : -12); if (a < lo) a = lo;

    if (f === 'weekly') rows.push({ label: MON[+k.slice(5) - 1] + ' ' + k.slice(0, 4), chips: weeksOf(k).map((w, i) => ({ key: w.key, label: 'W' + (i + 1), sub: fmtDay(w.start) })) });
    else { const y = k.slice(0, 4), r = rows.find(x => x.label === y) || (rows.push({ label: y, chips: [] }), rows[rows.length - 1]); r.chips.push({ key: k, label: MON[+k.slice(5) - 1] }); }
  }
  return rows;
}
// Opens the skip box, keeping a copy of the group so closing it can offer Undo.
function openSkip(id) {

  SKIPG = id; SKPREV = cp(g); paintSkip();
  document.getElementById('skmodal').hidden = false;
}
function paintSkip() {
  const g = D.recGroups.find(x => x.id === SKIPG); if (!g) return;

  document.getElementById('skHint').textContent = `Tap a ${weekly ? 'week' : 'month'} to leave it out; tap again to bring it back. Skipped ${weekly ? 'weeks' : 'months'} don't count anywhere.${sk.size ? ' ' + sk.size + ' skipped.' : ''}`;
  document.getElementById('skList').innerHTML = skipChoices(g).map(r => `<div class="skrow"><b>${r.label}</b><div class="skchips">${r.chips.map(c => `<button data-act="skTog" data-k="${c.key}" class="${sk.has(c.key) ? 'off' : ''}" title="${sk.has(c.key) ? 'Skipped — tap to count it again' : 'Counted — tap to skip'}">${c.label}${c.sub ? `<small>${c.sub}</small>` : ''}</button>`).join('')}</div></div>`).join('') || '<p class="hint">Nothing to skip in this range.</p>';

let SKPREV = null;

/* Lines you entered yourself in months this group covers, in the same categories as its items:
   those would be counted on top of the recurring items. */
function groupDuplicates(g) {
  const cats = new Set(D.recItems.filter(i => i.groupId === g.id).map(i => i.categoryId));
  if (!g.start || !cats.size) return [];
  return D.lines.filter(l => !l.recurId && !l.skip && cats.has(l.categoryId) && groupCovers(g, l.period))
    .sort((a, b) => a.period < b.period ? -1 : 1);
}
function dupWarning(g) {
  const ds = groupDuplicates(g); if (!ds.length) return '';
  const cats = [...new Set(ds.map(l => (IDX.cat[l.categoryId] || {}).name))].join(', ');
  const months = [...new Set(ds.map(l => l.period))];
  const range = months.length === 1 ? periodLabel(months[0]) : periodLabel(months[0]) + ' – ' + periodLabel(months[months.length - 1]);
  return `<div class="warn" style="margin:0 0 12px">Heads-up: ${months.length} month${months.length > 1 ? 's' : ''} in this range (${range}) also ${months.length > 1 ? 'have' : 'has'} ${ds.length} ${cats} line${ds.length > 1 ? 's' : ''} you entered separately (for example from your old sheet), so ${ds.length > 1 ? 'they' : 'it'} would be counted on top of this group.
    <div class="row" style="margin-top:8px"><button class="btn" data-act="rgDedupe" data-id="${g.id}">Remove ${ds.length > 1 ? 'those ' + ds.length + ' lines' : 'that line'}</button><span class="hint" style="margin:0">or keep them if they're something else.</span></div></div>`;
}

/* Saves in the background: the page updates straight away and the sheet catches up. A reply only replaces
   the local copy when no newer edit of the same thing is still on its way. */
function bgSave(key, p, merge, msg) {
  return tracked(key, p).then(res => { if (!PENDING[key] && merge) merge(res); if (msg) toast(msg); return res; }).catch(fail);
}
// Replace a row by id, or add it if it's new.
const putRow = (list, row) => { const j = list.findIndex(x => x.id === row.id); if (j >= 0) list[j] = row; else list.push(row); };
// Saves a group without waiting. The reply isn't merged because the page already has the newest copy.
function saveGroup(g, msg) {
  putRow(D.recGroups, g);
  if (gFreq(g) === 'weekly') D.recItems.forEach(i => { if (i.groupId === g.id) i.week = 'every'; });
  bgSave('rg|' + g.id, api('saveRecGroup', JSON.parse(JSON.stringify(g))), null, msg); // the page's copy is already up to date
}
function saveItem(it, msg) {
  putRow(D.recItems, it);
  // the sheet locks in the exchange rate; take that back, keep everything else as it is on the page
  bgSave('ri|' + it.id, api('saveRecItem', Object.assign({}, it, { amount: it.amount == null ? '' : it.amount })), row => { const x = D.recItems.find(y => y.id === row.id); if (x) x.rate = row.rate; }, msg);
}
let SKTIMER = null;
// A field changed on the Recurring page. Changing how often a group repeats clears its skips, because skipped months
// don't mean anything for a weekly group and vice versa.
function saveRecField(el) {
  const f = el.dataset.field, id = el.dataset.id;
  if (el.dataset.act === 'rg') {
    const g = Object.assign({}, D.recGroups.find(x => x.id === id), { [f]: el.value });
    if (f === 'name' && !el.value.trim()) { toast('Give the group a name.', true); return setTimeout(render, 0); }
    if (f === 'start' && g.end && g.start && g.end < g.start) g.end = '';
    if (f === 'freq') { g.freq = el.value === 'monthly' ? '' : el.value; g.skip = []; } // skipped months and weeks don't carry over
    const prevG = cp(D.recGroups.find(x => x.id === id)), prevI = cp(D.recItems.filter(i => i.groupId === id));
    pushUndo('change to ' + prevG.name, () => { saveGroup(prevG); prevI.forEach(i => { const cur = D.recItems.find(x => x.id === i.id); if (cur && JSON.stringify(cur) !== JSON.stringify(i)) saveItem(i); }); });
    setTimeout(render, 0);
    return saveGroup(g, f === 'start' ? (g.start ? 'Added from ' + periodLabel(g.start) : 'Taken off all months') : f === 'freq' ? 'Now repeats ' + FREQ_TXT[gFreq(g)].toLowerCase() : 'Saved');
  }
  const it = Object.assign({}, D.recItems.find(x => x.id === id));
  let v = el.value;
  if (f === 'amount') { v = evalAmount(v); if (Number.isNaN(v)) return badNumber(); v = v === '' ? null : Math.abs(v); }
  const prevI = cp(D.recItems.find(x => x.id === id));
  pushUndo('change to ' + (prevI.name || 'item'), () => saveItem(prevI));
  it[f] = v;
  if (f === 'currency') it.rate = rateOf(v);
  setTimeout(render, 0);
  saveItem(it, 'Saved');
}

/* ---------- Goals (Gantt) ---------- */
// 12 colours of the same depth (Tailwind 600 shades), ordered so neighbours look clearly different.
// They all read well on white, as a light "planned" bar and behind dark note text.
const GPALETTE = ['#7c3aed', '#059669', '#ea580c', '#2563eb', '#db2777', '#65a30d', '#0891b2', '#dc2626', '#ca8a04', '#4f46e5', '#0d9488', '#475569'];
/** The first palette colour no goal is using yet; once all 12 are taken, the one used least. */
function nextGoalColor() {
  const used = D.goals.map(g => String(g.color || '').toLowerCase());
  const free = GPALETTE.find(c => used.indexOf(c) === -1);
  if (free) return free;
  const count = c => used.filter(u => u === c).length;
  return GPALETTE.slice().sort((a, b) => count(a) - count(b))[0];
}
// Goals page state. GBRUSH = what a tap does (Planned / Done / Note). GSCROLL = where to scroll after the next draw.
// The first visit: on a computer it opens on "This month" (the month starts right after the goal names); on a phone,
// where only a few weeks fit, it opens on this week (this week right after the names, the coming weeks to its right).
let GBRUSH = 'plan', GSCROLL = 'start';
/* Which years are shown (one card each). Remembered on this device. */
let GYEARS = (() => {
  try { const v = JSON.parse(localStorage.getItem('goals-years') || 'null'); if (Array.isArray(v) && v.length) return v.map(Number).filter(Number.isInteger).sort(); } catch (e) {}
  return [new Date().getFullYear()];
})();
function saveYears() { try { localStorage.setItem('goals-years', JSON.stringify(GYEARS)); } catch (e) {} }
/* Years in the picker: last year, this year, next year, any year you added with "+ Year", and any year that has goals marked in it. */
const yearList = key => { try { const a = JSON.parse(S()[key] || '[]'); return Array.isArray(a) ? a.map(Number) : []; } catch (e) { return []; } };
const addedYears = () => yearList('goalYears'), removedYears = () => yearList('goalYearsRemoved');
/** Years that have goals marked or noted in them. */
function dataYears() { const set = new Set(); D.goals.forEach(g => Object.keys(g.marks || {}).concat(Object.keys(g.notes || {})).forEach(k => set.add(+k.slice(0, 4)))); return set; }
/* The picker: last, this and next year, years you added and years with goals — minus any you removed. This year always stays. */
function yearChoices() {
  const cy = today().getFullYear(), out = new Set([cy - 1, cy, cy + 1].concat(addedYears(), [...dataYears()])), gone = removedYears();
  gone.forEach(y => { if (y !== cy) out.delete(y); });

}
// The Years… box: add or remove years from the picker. Removed years are saved in the sheet so every device agrees.
function yearsModalHtml() {

    <div id="yList"></div>

/** Saves the added / removed year lists, then redraws. */
function saveYearLists(added, removed, then) {
  api('saveSettings', { goalYears: JSON.stringify([...new Set(added)].sort((a, b) => a - b)), goalYearsRemoved: JSON.stringify([...new Set(removed)].sort((a, b) => a - b)) })
    .then(d => { D = d; then(); }).catch(fail);
}

// CSS classes for a week column: lines at month, quarter and year starts, and today's week.
function gCls(weeks, w, i) {
  const c = [];
  if (i > 0 && weeks[i - 1].y !== w.y) c.push('ys');
  else if (i === 0 || weeks[i - 1].month !== w.month) c.push(w.month % 3 === 0 ? 'qs' : 'ms');
  if (w.key === iso(gMonday(today()))) c.push('today');

/* ---- Number series: a number note with a weekly change counts on in each following marked week ---- */
function noteNum(t) { const v = String(t == null ? '' : t).trim().replace(',', '.'); return /^[-+]?\d+(\.\d+)?%?$/.test(v) ? parseFloat(v) : null; } // "80%" counts as 80
/* A weekly change is a plain number (-0.5 = down 0.5 a week) or a percentage kept as text ("-2%" = down 2% a week, compounding). */
function parseStep(st) {
  if (st == null || st === '') return null;
  const raw = String(st).trim(), pct = /%$/.test(raw), v = parseFloat(pct ? raw.slice(0, -1) : raw);
  return isFinite(v) && v !== 0 ? { v, pct } : null;

// Number notes can step each following week by an amount or a % (compounding), e.g. a weight goal going down 0.5 a week.
const stepValue = (start, st, n) => { const p = parseStep(st); return !p ? start : p.pct ? start * Math.pow(1 + p.v / 100, n) : start + p.v * n; };

/** What each week of a goal shows: typed notes as typed; after a number with a weekly change, the next values

function goalCellNotes(g) {
  const out = {}, notes = g.notes || {}, steps = g.steps || {};
  const keys = Object.keys(notes).sort();
  keys.forEach(k => { out[k] = { text: notes[k], auto: false }; });
  keys.forEach((k, idx) => {
    const step = steps[k], start = noteNum(notes[k]), unit = /%\s*$/.test(notes[k]) ? '%' : '';

    const stop = keys[idx + 1];
    Object.keys(g.marks || {}).filter(w => w > k && (!stop || w < stop)).forEach(w => {
      const n = Math.round(daysBetween(parseISO(k), parseISO(w)) / 7);

/* Phone: a group's buttons live in a small menu so its name has room. */

/* All picked years in one table, side by side, each with its own year, quarter, month and week headings. */
function timelineCard(years) {
  const ys = years.slice().sort((a, b) => a - b), cy = today().getFullYear();
  const per = ys.map(y => ({ y, weeks: gWeeks(y) }));
  const weeks = [].concat(...per.map(p => p.weeks));
  const curWeek = weeks.find(w => w.key === iso(gMonday(today())));
  let yr = '', qr = '', mr = '';
  per.forEach((p, pi) => {
    const mc = Array(12).fill(0); p.weeks.forEach(w => mc[w.month]++);
    const first = pi ? ' ys' : '', gap = pi ? '<th class="ygap"></th>' : '';
    yr += gap; qr += gap; mr += gap;
    yr += `<th colspan="${p.weeks.length}" class="${first}"><span class="ylab">${p.y}${p.y === cy ? ' <span class="nowtag">THIS YEAR</span>' : ''}</span></th>`;
    [0, 1, 2, 3].forEach(q => { qr += `<th colspan="${mc[q * 3] + mc[q * 3 + 1] + mc[q * 3 + 2]}" class="${q ? 'qs' : first}">Q${q + 1} ${p.y}</th>`; });
    mc.forEach((n, i) => { mr += `<th colspan="${n}" class="${i ? (i % 3 === 0 ? 'qs' : 'ms') : first}${curWeek && p.y === curWeek.y && i === curWeek.month ? ' curm' : ''}">${n >= 4 ? MONTHS[i] : MON[i]}</th>`; });
  });
  const title = ys.length === 1 ? ys[0] : ys.every((y, i) => !i || y === ys[i - 1] + 1) ? ys[0] + ' – ' + ys[ys.length - 1] : ys.join(', ');
  return `<div class="card gcard">
    <div class="gwrap" data-y="all"><table class="gantt"><thead>
    <tr class="y"><th class="gl" rowspan="4"><div class="glhead"><span class="gyrs">${title}</span><span>Goals</span></div></th>${yr}</tr>
    <tr class="q">${qr}</tr>
    <tr class="m">${mr}</tr>
    <tr class="w">${weeks.map((w, i) => `${i && weeks[i - 1].y !== w.y ? '<th class="ygap"></th>' : ''}<th class="wk ${gCls(weeks, w, i)}" data-y="${w.y}" data-m="${w.month}" title="Week of ${fmtDate(w.key)}">W${w.n}<small>${pad(w.date.getDate())}</small></th>`).join('')}</tr>
    </thead><tbody id="gbody">${goalsBody(weeks)}</tbody></table></div></div>`;
}
// Weeks of every chosen year, oldest year first, as one timeline.
const shownWeeks = () => [].concat(...GYEARS.slice().sort((a, b) => a - b).map(gWeeks));

/* Goals in display order, split into groups: goals without a group first, then each group in the order

function goalLayout() {
  const gs = D.goals.slice().sort((a, b) => (a.order - b.order));
  const groups = [], at = {};
  gs.forEach(g => { const n = g.grp || ''; if (!(n in at)) { at[n] = groups.length; groups.push({ name: n, goals: [] }); } groups[at[n]].goals.push(g); });
  return groups.filter(x => !x.name).concat(groups.filter(x => x.name));
}
// One goal's row: name, done count, then a cell per week. Planned/done weeks draw as joined bars.

      bar = `<div class="gb ${v}${prev ? '' : ' s'}${next ? '' : ' e'}"></div>`;
    }

    <button class="gmore" data-act="gMenu" data-id="${g.id}" title="Group, move, hide or delete" aria-label="More for this goal">⋯</button></div></td>${cells}</tr>`;

/** Full-width filler for a row: one cell per year with the gap between, so the space between years runs top to bottom. */
function yearSpans(weeks, cls, content) {

// All goal rows, under their group headers. Hidden goals are left out unless 'Peek' is on (then they show faded).

        <button class="gmore gphone" data-act="gGroupMenu" data-name="${nm}" title="Move, add or hide" aria-label="More for this group">⋯</button></div></td>
        ${yearSpans(weeks, 'gheadfill', collapsed ? `<span class="ghcount">${grp.goals.length} hidden goal${grp.goals.length > 1 ? 's' : ''} · tap ▸ to show</span>` : '')}</tr>`;

/* ---- Select mode: tick several goals, then hide, move or delete them together ---- */

// Hide or show goals, like hiding rows in a sheet. Saved in the sheet so it holds on every device.
function setHidden(ids, hidden, msg) {
  ids.forEach(id => { const g = D.goals.find(x => x.id === id); if (g) g.hidden = hidden; });
  applyLayout(goalLayout(), msg);
}

/* Puts goals into the given order (and groups), then saves it. */
function applyLayout(L, msg) {

  L.forEach(grp => grp.goals.forEach(g => { g.order = o++; g.grp = grp.name; list.push({ id: g.id, order: g.order, grp: g.grp, hidden: !!g.hidden }); }));
  render();

}
const shown = g => !g.hidden || GPEEK;
/** The position a goal would swap into when moved up (d=-1) or down (d=1), skipping hidden goals; -1 if none. */
function stepIndex(list, i, d) { let j = i + d; while (j >= 0 && j < list.length && !shown(list[j])) j += d; return j >= 0 && j < list.length ? j : -1; }
// Move a goal up or down inside its group, skipping hidden goals (so a move is never 'wasted' on an invisible row).
function moveGoal(id, d) {
  const L = goalLayout(), grp = L.find(x => x.goals.some(g => g.id === id)), i = grp.goals.findIndex(g => g.id === id), j = stepIndex(grp.goals, i, d);
  if (j < 0) return;
  const [g] = grp.goals.splice(i, 1); grp.goals.splice(j, 0, g);

}
// Move goals into a group (or out of any group with a blank name).
function setGoalGroup(ids, name) {
  ids = [].concat(ids); name = String(name || '').trim().slice(0, 60);
  const L = goalLayout(), gs = ids.map(id => D.goals.find(x => x.id === id)).filter(Boolean);
  L.forEach(x => { x.goals = x.goals.filter(y => ids.indexOf(y.id) < 0); });
  let target = L.find(x => x.name === name);
  if (!target) { target = { name, goals: [] }; if (name) L.push(target); else L.unshift(target); }
  target.goals.push(...gs);

/* ---- Drag a goal up/down, within its group or into another (mouse and touch) ---- */
let GDRAG = null;
// Drag and drop of goals by their handle (mouse and touch): where the dragged row would land.
function dragTarget(x, y) {
  const D0 = GDRAG, el = document.elementFromPoint(x, y);
  let tr = el && el.closest && el.closest('tr');
  if (!tr || tr.parentElement !== D0.tbody) {
    const r = D0.tbody.getBoundingClientRect();
    if (y < r.top) tr = D0.tbody.querySelector('tr');
    else if (y > r.bottom) tr = D0.tbody.querySelector('tr.addrow');
    else return D0.target; // off to the side: keep the last spot
  }
  const L = D0.layout, rect = tr.getBoundingClientRect(), top = y < rect.top + rect.height / 2;
  const blockBefore = name => { // the block just above a group (goals without a group if it's the first group)
    const i = L.findIndex(b => b.name === name); return i > 0 ? L[i - 1] : { name: '', goals: (L.find(b => !b.name) || { goals: [] }).goals };
  };
  if (tr.dataset.gid) {
    if (tr.dataset.gid === D0.id) return { same: true, y: rect.top + rect.height / 2 };
    const grp = tr.dataset.grp || '', b = L.find(x => x.name === grp), i = b.goals.findIndex(g => g.id === tr.dataset.gid);
    return { grp, idx: top ? i : i + 1, y: top ? rect.top : rect.bottom };
  }

    const grp = tr.dataset.grp || '', b = L.find(x => x.name === grp), i = b ? b.goals.findIndex(g => g.id === tr.dataset.first) : -1;
    if (i >= 0) return { grp, idx: top ? i : i + Number(tr.dataset.n), y: top ? rect.top : rect.bottom };
  }

    const head = tr.classList.contains('ghead') ? tr : tr.nextElementSibling, name = head.dataset.grp;
    if (tr.classList.contains('ghead') && !top) return { grp: name, idx: 0, y: head.getBoundingClientRect().bottom };
    const prev = blockBefore(name), sp = head.previousElementSibling;

function dragMove(x, y) {

  const t = dragTarget(x, y); if (!t) return;

}

  document.body.classList.remove('gdragging'); showBar();
  const t = d.target; if (cancel || !t || t.same) return;
  const L = goalLayout(), g = D.goals.find(x => x.id === d.id);
  const from = L.find(b => b.goals.some(x => x.id === d.id)), fromIdx = from.goals.findIndex(x => x.id === d.id);

app.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.ghandle'); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const row = h.closest('tr'), g = D.goals.find(x => x.id === row.dataset.gid); if (!g) return;
  const L = goalLayout(); L.forEach(b => { b.goals = b.goals.filter(x => x.id !== g.id); }); // positions counted without the goal being moved
  const ghost = document.createElement('div'); ghost.className = 'gghost'; ghost.innerHTML = `<i style="background:${esc(g.color)}"></i>${esc(g.name || 'Untitled goal')}`;
  const line = document.createElement('div'); line.className = 'gdropline';
  document.body.append(ghost, line); document.body.classList.add('gdragging');
  BAR.classList.add('away'); // phone: tuck the tab bar away so you can drop near the bottom of the screen
  row.classList.add('dragging');
  GDRAG = { id: g.id, row, tbody: row.parentElement, layout: L, ghost, line, target: null };
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  dragMove(e.clientX, e.clientY);
  // scroll the page when dragging near the top or bottom edge
  GDRAG.timer = setInterval(() => {
    if (!GDRAG) return;
    const topEdge = hdrHeight() + 50, bottomEdge = window.innerHeight - 70;
    const dy = GDRAG.y < topEdge ? -Math.min(14, (topEdge - GDRAG.y) / 3 + 3) : GDRAG.y > bottomEdge ? Math.min(14, (GDRAG.y - bottomEdge) / 3 + 3) : 0;
    if (dy) { window.scrollBy(0, dy); dragMove(GDRAG.x, GDRAG.y); }
  }, 16);
}, true);
document.addEventListener('pointermove', e => { if (GDRAG) { e.preventDefault(); dragMove(e.clientX, e.clientY); } }, { passive: false });
